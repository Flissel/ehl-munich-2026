/* Layout: one reading column, sections in pitch order, a type-plate badge per derivative, charts on a quiet surface. */
:root {
  --bg: #f3f5f7; --surface: #fdfdfc; --ink: #10161d; --ink-2: #46515c; --muted: #6f7a85;
  --line: #dfe4e9; --line-2: #c3ccd5; --accent: #1c5cab; --accent-soft: #e3edf9;
  --ph: #8a5100; --ph-bg: #fff3dc; --ph-line: #d68a00;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --neutral: #b9b8b0;
  --y1: #86b6ef; --y2: #2a78d6; --y3: #104281;
  --s0: #cde2fb; --s1: #9ec5f4; --s2: #6da7ec; --s3: #3987e5; --s4: #256abf; --s5: #184f95; --s6: #0d366b;
  --s-ink-lo: #10161d; --s-ink-hi: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1115; --surface: #151a1f; --ink: #e8ecef; --ink-2: #b3bcc5; --muted: #8893a0;
  --line: #252d35; --line-2: #3a4652; --accent: #6da7ec; --accent-soft: #17283b;
  --ph: #f2b54a; --ph-bg: #2b2110; --ph-line: #c98500;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --neutral: #5d5c57;
  --y1: #184f95; --y2: #3987e5; --y3: #9ec5f4;
  --s0: #1a2633; --s1: #184f95; --s2: #1c5cab; --s3: #2a78d6; --s4: #5598e7; --s5: #86b6ef; --s6: #b7d3f6;
  --s-ink-lo: #e8ecef; --s-ink-hi: #0d1115; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d1115; --surface: #151a1f; --ink: #e8ecef; --ink-2: #b3bcc5; --muted: #8893a0;
  --line: #252d35; --line-2: #3a4652; --accent: #6da7ec; --accent-soft: #17283b;
  --ph: #f2b54a; --ph-bg: #2b2110; --ph-line: #c98500;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --neutral: #5d5c57;
  --y1: #184f95; --y2: #3987e5; --y3: #9ec5f4;
  --s0: #1a2633; --s1: #184f95; --s2: #1c5cab; --s3: #2a78d6; --s4: #5598e7; --s5: #86b6ef; --s6: #b7d3f6;
  --s-ink-lo: #e8ecef; --s-ink-hi: #0d1115; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.05; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.6rem, 7vw, 4.4rem); letter-spacing: -0.01em; }
h2 { font-size: clamp(1.8rem, 4vw, 2.4rem); }
h3 { font-size: 1.25rem; }
p { margin: 0; max-width: 68ch; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font: 600 0.75rem/1.2 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--ink-2); font-size: 1.05rem; }
.src { font-size: 0.8rem; color: var(--muted); }
.mono { font-family: var(--mono); font-size: 0.85em; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; gap: 16px; padding-block: 10px; }
.brand { font: 600 1.1rem/1 var(--display); letter-spacing: 0.02em; white-space: nowrap; }
.bar nav { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.bar nav a { color: var(--ink-2); text-decoration: none; font-size: 0.85rem; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
.bar nav a:hover { background: var(--accent-soft); color: var(--ink); }
#phToggle { font: 600 0.8rem/1 var(--body); color: var(--ph); background: var(--ph-bg); border: 1px dashed var(--ph-line); border-radius: 999px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
#phToggle[aria-pressed="false"] { color: var(--muted); background: transparent; border-color: var(--line-2); }

main > section { padding-block: 56px; border-bottom: 1px solid var(--line); display: grid; gap: 24px; }
main > section:last-of-type { border-bottom: 0; }
.head { display: grid; gap: 8px; }

/* placeholders */
span.ph, div.ph { color: var(--ph); background: var(--ph-bg); border: 1px dashed var(--ph-line); border-radius: 4px; padding: 0 0.3em; font-style: italic; font-family: var(--body); font-weight: 500; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
h1 span.ph { font-family: var(--display); font-weight: 600; font-style: normal; padding: 0 0.15em; }
.quiet span.ph, .quiet div.ph { background: transparent; border-color: transparent; color: var(--muted); }
.quiet .phn path, .quiet .phn rect, .quiet .phn circle { stroke: var(--line-2); }
.flash { animation: flash 1.2s ease-out 1; }
@keyframes flash { 0% { box-shadow: 0 0 0 6px var(--ph-line); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* pitch */
#pitch { padding-block: 64px 48px; }
.claim { font-size: clamp(1.15rem, 2.4vw, 1.45rem); line-height: 1.4; max-width: 46ch; }
.kpis { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.kpi { flex: 1 1 170px; background: var(--surface); padding: 16px; display: grid; gap: 4px; align-content: start; }
.kpi b { font: 600 2rem/1 var(--display); }
.kpi span { font-size: 0.82rem; color: var(--ink-2); }

/* product plates */
.plates { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.plate { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; align-content: start; }
.plate-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.code { font: 700 1.6rem/1 var(--mono); letter-spacing: 0.04em; border: 2px solid var(--ink); border-radius: 4px; padding: 3px 7px 1px; }
.model { color: var(--ink-2); font-size: 0.9rem; }
.plate dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 0.85rem; }
.plate dt { color: var(--muted); }
.plate dd { margin: 0; min-width: 0; }
.stack { display: flex; gap: 2px; height: 10px; }
.stack i { display: block; height: 100%; min-width: 2px; }
.stack i:first-child { border-radius: 4px 0 0 4px; } .stack i:last-child { border-radius: 0 4px 4px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* charts */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.multiples { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font: 11px var(--body); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--line-2); stroke-width: 1; }
.hbars { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 2fr) auto; gap: 6px 10px; align-items: center; font-size: 0.82rem; }
.hbars .lab { color: var(--ink-2); overflow-wrap: anywhere; }
.hbars .track { height: 10px; }
.hbars .fill { height: 100%; border-radius: 0 4px 4px 0; background: var(--c1); }
.hbars .val { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
.panel.scroll table { min-width: 760px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.heat td.cell { text-align: center; font-variant-numeric: tabular-nums; min-width: 64px; border: 2px solid var(--surface); }
.heat td.item { color: var(--ink-2); min-width: 200px; }
.btn { font: 600 0.82rem/1 var(--body); color: var(--accent); background: transparent; border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 12px; cursor: pointer; justify-self: start; }
.btn:hover { background: var(--accent-soft); }

/* workflow */
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; counter-reset: s; }
.flow li { counter-increment: s; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.flow li::before { content: counter(s); font: 600 0.8rem/1 var(--mono); color: var(--muted); }
.flow li.human { border-color: var(--c2); box-shadow: inset 0 0 0 1px var(--c2); }
.who { justify-self: start; font: 600 0.7rem/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; border: 1px solid currentColor; }
.who.ai { color: var(--c1); } .who.system { color: var(--ink-2); } .who.human { color: var(--c2); }

/* requirements and audit */
.req tbody tr.main { cursor: pointer; }
.req tbody tr.main:hover td { background: var(--accent-soft); }
.req tr.detail td { background: var(--bg); }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 20px; padding: 6px 0; }
.detail-grid div { display: grid; gap: 2px; }
.detail-grid b { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.status { font: 600 0.72rem/1 var(--body); padding: 4px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.note { font-size: 0.78rem; color: var(--muted); display: block; margin-top: 2px; }
tr.example td { color: var(--muted); }

/* demo */
.steps { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start; }
.step-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.shot { aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; text-align: center; padding: 12px; font-size: 0.85rem; }
div.shot.ph { border-radius: 8px; }
#finale > .shot, #finale > .shot-img { max-width: 720px; width: 100%; }
.shot-img { width: 100%; border-radius: 8px; border: 1px solid var(--line); }
.prompt { font-family: var(--mono); font-size: 0.82rem; background: var(--bg); border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: 0 6px 6px 0; }
.fallback { font-size: 0.8rem; color: var(--ink-2); }

/* finale */
#finale h2 { font-size: clamp(2.2rem, 5vw, 3.2rem); }
.graph-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow-x: auto; }
.graph-wrap svg { width: 100%; min-width: 640px; height: auto; display: block; }
.graph-wrap .edge { stroke: var(--line-2); stroke-width: 1.2; }
.graph-wrap .lbl { font: 11px var(--body); fill: var(--ink-2); }
.graph-wrap .phn .lbl { fill: var(--ph); font-style: italic; }
.graph-wrap .node { stroke: var(--surface); stroke-width: 2; }
.graph-wrap .phn .node { fill: var(--ph-bg); stroke: var(--ph-line); stroke-dasharray: 3 2; stroke-width: 1.5; }
.closing { display: grid; gap: 12px; font-size: clamp(1.2rem, 2.6vw, 1.6rem); line-height: 1.35; font-family: var(--display); font-weight: 500; }
.open-group summary { cursor: pointer; font-weight: 600; padding-block: 6px; }
.open-group summary b { color: var(--ph); }
.open-list { columns: 2 280px; column-gap: 24px; padding-left: 18px; margin: 0; font-size: 0.82rem; }
.open-list li { break-inside: avoid; margin-bottom: 6px; }
.open-list button { all: unset; cursor: pointer; color: var(--ph); text-decoration: underline dotted; }
.open-list .mono { color: var(--muted); }
footer { padding-block: 32px 64px; }

#tip { position: fixed; z-index: 20; max-width: 300px; background: var(--ink); color: var(--bg); font-size: 0.78rem; line-height: 1.4; padding: 6px 9px; border-radius: 6px; pointer-events: none; }
@media (max-width: 640px) { .brand { display: none; } main > section { padding-block: 40px; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
</style>

  <div class="wrap bar-in">
    <span class="brand" id="brand">EHL 2026</span>
    <nav aria-label="Sections">
      <a href="#pitch">Pitch</a><a href="#data">Data</a><a href="#voice">Customer voice</a><a href="#workflow">Workflow</a>
      <a href="#requirements">Requirements</a><a href="#audit">Audit trail</a><a href="#demo">Live demo</a><a href="#finale">Finale</a>
    </nav>
    <button id="phToggle" type="button" aria-pressed="true" title="Mark or quiet the placeholders">Placeholders <b id="phCount">0</b></button>
  </div>
</header>

<main class="wrap">
  <section id="pitch"></section>
  <section id="data"></section>
  <section id="voice"></section>
  <section id="workflow"></section>
  <section id="requirements"></section>
  <section id="audit"></section>
  <section id="demo"></section>
  <section id="finale"></section>
</main>
<footer class="wrap" id="open"></footer>
<div id="tip" role="tooltip" hidden></div>

<script>
const REAL = JSON.parse(document.getElementById('data-real').textContent || '{}');
const TEAM = JSON.parse(document.getElementById('data-team').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Number(n).toLocaleString('en-US');
const isPh = x => x == null || x === '' || (typeof x === 'object' && 'ph' in x);
let phN = 0;

/* A placeholder carries its JSON path and where the real content comes from. */
function phAttrs(path, from) {
  return `id="ph-${++phN}" data-ph="${esc(path)}" data-from="${esc(from || '')}" tabindex="0" data-tip="${esc('Placeholder: ' + path + (from ? '. From: ' + from : ''))}"`;
}
function v(x, path, hint = 'to be filled', from = '') {
  if (!isPh(x)) return esc(x);
  const p = x && x.ph ? x : { ph: hint, from };
  return `<span class="ph" ${phAttrs(path, p.from)}>${esc(p.ph)}</span>`;
}
function shot(x, path) {
  if (!isPh(x)) return `<img class="shot-img" src="${esc(x)}" alt="" loading="lazy">`;
  return `<div class="shot ph" ${phAttrs(path, x && x.from)}>${esc((x && x.ph) || 'Screenshot')}</div>`;
}
const noReal = what => `<p>${v(null, 'real.' + what, 'Run python demo/showcase/fill_data.py to load the real numbers', 'Dataset/')}</p>`;
const section = (id, eyebrow, title, lede, body) => {
  $('#' + id).innerHTML = `<div class="head"><p class="eyebrow">${eyebrow}</p><h2>${title}</h2>${lede ? `<p class="lede">${lede}</p>` : ''}</div>${body}`;
};
const product = code => (REAL.products || []).find(p => p.code === code);
const studyItem = name => REAL.study && REAL.study.items.find(i => i.name === name);
function studyCells(name, code) {
  const it = studyItem(name);
  if (!it) return [];
  return REAL.study.columns.map((c, i) => ({ ...c, value: it.values[i] })).filter(c => c.product === code);
}
function signal(code, key) {
  if (!key) return null;
  const [kind, category] = key.split('|');
  const p = product(code);
  return p && p.feedback && p.feedback.signals.find(s => s.kind === kind && s.category === category);
}
function niceMax(x) { const e = 10 ** Math.floor(Math.log10(x)); return Math.ceil(x / e) * e; }
function barPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

/* 1 Pitch */
function renderPitch() {
  const m = TEAM.meta, k = REAL.kpis;
  const kpis = k ? [
    [fmt(k.feedback_rows), `feedback rows, ${fmt(k.unique_comments)} unique comments (F70, G60, G70)`],
    [k.derivatives, 'derivatives: F70, G60, G68, G70'],
    [fmt(k.study_cells), 'satisfaction scores from the 2025 studies in China and Europe'],
    [fmt(k.us_study_items), 'items in the 2025 US study (G60, G70)'],
    [fmt(k.volume_2030), 'units in the 2030 sales plan, all markets'],
  ].map(([b, s]) => `<div class="kpi"><b class="num">${b}</b><span>${s}</span></div>`).join('') : '';
  $('#pitch').innerHTML = `<div class="head"><p class="eyebrow">EHL Grand Finale 2026, BMW challenge: AI for Product Decision Making</p>
    <h1>${v(m.product, 'team.meta.product')}</h1></div>
    <p class="claim">${v(m.claim, 'team.meta.claim')}</p>
    <p class="lede">${esc(m.challenge)}</p>
    ${k ? `<div class="kpis">${kpis}</div><p class="src">Source: Dataset/ (BMW hackathon files), aggregated by fill_data.py on ${esc(REAL.generated)}.</p>` : noReal('kpis')}
    <p class="src">${v(m.team, 'team.meta.team')}</p>`;
  if (!isPh(m.product)) $('#brand').textContent = m.product;
}

/* 2 Data basis */
const TYPES = [['likes', 'Likes', '--c1'], ['wants', 'Wants', '--c2'], ['difficult', 'Difficult to use', '--c3'], ['defect', 'Defect', '--c4'], ['untyped', 'No type', '--neutral']];
function renderData() {
  if (!REAL.products) return section('data', 'Data basis', 'Four derivatives, one dataset', '', noReal('products'));
  const legend = `<div class="legend">${TYPES.map(([, l, c]) => `<span><i class="sw" style="background:var(${c})"></i>${l}</span>`).join('')}</div>`;
  const plates = REAL.products.map(p => {
    const f = p.feedback;
    const stack = f ? `<div class="stack" role="img" aria-label="Feedback types">${TYPES.map(([key, l, c]) => {
      const n = f.types[key] || 0;
      return n ? `<i style="flex:${n};background:var(${c})" data-tip="${esc(`${p.code}: ${l} ${fmt(n)} (${Math.round(n / f.unique * 100)} %)`)}"></i>` : '';
    }).join('')}</div>` : '';
    const markets = f ? Object.entries(f.markets).map(([m, n]) => `${m} ${fmt(n)}`).join(', ') : '';

function volumeCharts() {
  const sheets = REAL.volumes.sheets, mk = ['EU', 'CN', 'US', 'RoW'];
  const max = niceMax(Math.max(...Object.values(sheets).flatMap(s => Object.values(s).flat())));
  const W = 320, H = 190, L = 44, B = 22, T = 8, ph = H - B - T, gw = (W - L) / mk.length, bw = Math.min(16, gw / 4);
  const y = val => T + ph - val / max * ph;
  const names = { F70: 'F70', G60_G68: 'G60 and G68', G70: 'G70' };
  return Object.entries(sheets).map(([sheet, rows]) => {
    const ticks = [0, max / 2, max].map(t => `<line class="grid" x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t ? fmt(t / 1000) + 'k' : 0}</text>`).join('');
    const bars = mk.map((m, i) => {
      const x0 = L + i * gw + (gw - bw * 3 - 4) / 2;
      const vals = rows[m] || [0, 0, 0];
      return vals.map((val, j) => {
        const tip = esc(`${names[sheet]}, ${m}, ${REAL.volumes.years[j]}: ${fmt(val)} units`);
        const x = x0 + j * (bw + 2);
        return `<path d="${barPath(x, y(val), bw, Math.max(val / max * ph, 0.01), 4)}" fill="var(--y${j + 1})"/><rect x="${x - 1}" y="${T}" width="${bw + 2}" height="${ph}" fill="transparent" data-tip="${tip}"/>`;
      }).join('') + `<text x="${L + i * gw + gw / 2}" y="${H - 6}" text-anchor="middle">${m}</text>`;
    }).join('');
    return `<figure class="chart" style="margin:0"><figcaption class="src" style="color:var(--ink)">${names[sheet]}</figcaption>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales volumes ${names[sheet]}">${ticks}<line class="base" x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>${bars}</svg></figure>`;
  }).join('');
}

/* 8 Finale: knowledge graph, top attributes, closing */
const GROUPS = { Projects: '--c1', Topics: '--c2', People: '--c3', Organizations: '--c4', Content: '--c5', Requirements: '--c6' };
function shape(grp, r) {
  if (grp === 'Topics') return `<rect class="node" x="${-r}" y="${-r}" width="${2 * r}" height="${2 * r}" rx="2"/>`;
  if (grp === 'People') return `<path class="node" d="M0,${-r - 1}L${r + 1},${r}H${-r - 1}Z"/>`;
  if (grp === 'Organizations') return `<path class="node" d="M0,${-r - 2}L${r + 2},0L0,${r + 2}L${-r - 2},0Z"/>`;
  if (grp === 'Content') return `<rect class="node" x="${-r}" y="${-r}" width="${2 * r}" height="${2 * r}" rx="${r}" />`;
  if (grp === 'Requirements') return `<path class="node" d="M${-r},${-r * 0.6}H${r}V${r * 0.6}H${-r}Z"/>`;
  return `<circle class="node" r="${r}"/>`;
}
function layout(nodes, links, W, H) {
  const at = new Map(nodes.map((n, i) => [n.id, i]));
  const E = links.map(([a, b]) => [at.get(a), at.get(b)]).filter(([a, b]) => a != null && b != null);
  const groups = Object.keys(GROUPS);
  nodes.forEach((n, i) => { const a = groups.indexOf(n.grp) / groups.length * 2 * Math.PI + i * 0.37; n.x = W / 2 + Math.cos(a) * W * 0.3; n.y = H / 2 + Math.sin(a) * H * 0.3; });
  const k = Math.sqrt(W * H / nodes.length) * 0.6;
  for (let it = 0, t = W / 8; it < 500; it++, t *= 0.99) {
    nodes.forEach(n => { n.dx = 0; n.dy = 0; });
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy) || 0.01, f = k * k / d;
      a.dx += dx / d * f; a.dy += dy / d * f; b.dx -= dx / d * f; b.dy -= dy / d * f;
    }
    E.forEach(([i, j]) => {
      const a = nodes[i], b = nodes[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy) || 0.01, f = d * d / k;
      a.dx -= dx / d * f; a.dy -= dy / d * f; b.dx += dx / d * f; b.dy += dy / d * f;
    });
    nodes.forEach(n => { n.dx += (W / 2 - n.x) * 0.05; n.dy += (H / 2 - n.y) * 0.05; const d = Math.hypot(n.dx, n.dy) || 1; n.x += n.dx / d * Math.min(d, t); n.y += n.dy / d * Math.min(d, t); });
  }
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  nodes.forEach(n => { n.x = 40 + (n.x - x0) / ((x1 - x0) || 1) * (W - 200); n.y = 30 + (n.y - y0) / ((y1 - y0) || 1) * (H - 60); });
  return E;
}
function graphSvg() {
  const g = REAL.graph, N = [], L = [];
  const add = (id, label, grp, r = 8, path = null, from = '') => N.push({ id, label, grp, r, path, from });
  const tail = s => s.split('/').pop();
  g.products.forEach(p => { add(p.id, tail(p.id), 'Projects', 11); L.push([p.id, p.roadmap], [p.id, g.research[0]]); });
  g.roadmaps.forEach(r => add(r, tail(r), 'Projects', 7));
  [...g.channels, ...g.research].forEach(t => add(t, tail(t), 'Topics', 7));
  g.team.forEach(t => add(t, tail(t), 'People', 7));
  TEAM.graph.organizations.forEach((o, i) => {
    const id = 'org' + i, ph = isPh(o.name);
    add(id, ph ? o.name.ph : o.name, 'Organizations', 7, ph ? `team.graph.organizations[${i}].name` : null, ph && o.name.from);
    L.push([id, o.product], [id, o.channel], [id, g.team[0]]);
  });
  const c = TEAM.graph.content, cph = isPh(c.name);
  add('content', cph ? c.name.ph : c.name, 'Content', 8, cph ? 'team.graph.content.name' : null, cph && c.name.from);
  L.push(['content', c.product], ['content', c.channel], ...TEAM.graph.organizations.map((o, i) => ['content', 'org' + i]));
  TEAM.requirements.forEach(r => { add('req:' + r.id, r.id, 'Requirements', 8); L.push(['req:' + r.id, 'Projects/' + r.product]); });
  const W = 960, H = 540, E = layout(N, L, W, H);
  const edges = E.map(([a, b]) => `<line class="edge" x1="${N[a].x}" y1="${N[a].y}" x2="${N[b].x}" y2="${N[b].y}"/>`).join('');
  const nodes = N.map(n => {
    const attrs = n.path ? `class="phn" ${phAttrs(n.path, n.from)}` : `data-tip="${esc(`${n.grp}: ${n.label}`)}"`;
    return `<g transform="translate(${n.x.toFixed(1)},${n.y.toFixed(1)})" ${attrs} style="fill:var(${GROUPS[n.grp]})">${shape(n.grp, n.r)}<text class="lbl" x="${n.r + 5}" y="4">${esc(n.label)}</text></g>`;
  }).join('');
  const counts = Object.keys(GROUPS).map(k => [k, N.filter(n => n.grp === k).length]);
  const legend = counts.map(([k, n]) => `<span><svg width="14" height="14" viewBox="-7 -7 14 14" style="fill:var(${GROUPS[k]})">${shape(k, 5)}</svg>${k} <b class="num">${n}</b></span>`).join('');
  return { svg: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Knowledge graph of the demo vault">${edges}${nodes}</svg>`, legend, n: N.length, ph: N.filter(n => n.path).length };
}

/* Tooltip for everything with data-tip */
const tip = $('#tip');
function showTip(t, x, y) {
  tip.textContent = t.dataset.tip; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(x + 12, innerWidth - r.width - 8) + 'px';
  tip.style.top = (y + 16 + r.height > innerHeight ? y - r.height - 10 : y + 16) + 'px';
}
document.addEventListener('pointermove', e => { const t = e.target.closest('[data-tip]'); t ? showTip(t, e.clientX, e.clientY) : (tip.hidden = true); });
document.addEventListener('focusin', e => { const t = e.target.closest('[data-tip]'); if (t) { const r = t.getBoundingClientRect(); showTip(t, r.left, r.bottom - 8); } });
document.addEventListener('focusout', () => { tip.hidden = true; });
</script>
