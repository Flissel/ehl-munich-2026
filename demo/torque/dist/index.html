/* Analyst mode: a blue grey workspace, a deep blue sidebar, a blue line under the header, the switch and a badge in blue,
   so the mode is never in doubt; Essentials keeps the neutral black */
:root:has(body.analyst){--bg:#e1e6ef;--surface:#fbfcfe;--surface-2:#eef1f7;--line:#d2d9e5;--line-2:#bfc8d8;--side:#0d1a3a;--side-2:#172752;--side-line:#24356a}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):has(body.analyst){--bg:#191e29;--surface:#212736;--surface-2:#29303f;--line:#333b4d;--line-2:#454e63;--side:#0b1430;--side-2:#152248;--side-line:#21305e}
}
:root[data-theme="dark"]:has(body.analyst){--bg:#191e29;--surface:#212736;--surface-2:#29303f;--line:#333b4d;--line-2:#454e63;--side:#0b1430;--side-2:#152248;--side-line:#21305e}
body.analyst .top{box-shadow:inset 0 -2px 0 var(--accent)}
#lvlSeg button[data-level="analyst"][aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
#lvlSeg button svg{width:13px;height:13px}
body.analyst #lvlSeg{border-color:var(--accent)}
body.analyst .crumb h1::after{content:"Analyst mode";display:inline-block;margin-left:10px;vertical-align:3px;padding:3px 8px;border-radius:999px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-2);font:600 10.5px/1.2 var(--font);letter-spacing:.06em;text-transform:uppercase}
body:not(.analyst) .stats3{grid-template-columns:repeat(2,minmax(0,1fr))}
body:not(.analyst) .rd-f{border-top:0;padding-top:0}
body:not(.analyst) .sum .qt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* car parts customers criticise (Vehicle Parts notes) and the knowledge graph block of a purchase driver */
.hd{display:block;width:10px;height:10px;border-radius:50%}
.kg{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:8px 12px 4px;background:var(--surface-2)}
.kg-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:2px}
.kg-h>span{margin-right:auto}
.kg-h .rbl{text-transform:none;letter-spacing:0}
.kgr{display:grid;grid-template-columns:14px auto minmax(0,1fr);gap:8px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:7px 0;text-align:left;font-size:12.5px;color:var(--ink-2)}
.kgr:first-of-type{border-top:0}
.kgr b{color:var(--ink);font-weight:600;white-space:nowrap}
.kgr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.kgr:hover b{color:var(--accent)}
.kgi{display:grid;place-items:center}
.kgi svg{width:13px;height:13px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kgr .hd{margin-left:2px}
@media (max-width:640px){
  .kgr{grid-template-columns:14px minmax(0,1fr);row-gap:1px}
  .kgr span{grid-column:2;white-space:normal}
  body.analyst .crumb h1::after{content:"Analyst";margin-left:8px}
}
/* ---------- Essentials overview: tiles that are links, banner by state ---------- */
.nextstep.open{background:color-mix(in oklab,var(--crit) 9%,var(--surface));color:var(--ink);border:1px solid color-mix(in oklab,var(--crit) 35%,var(--line));box-shadow:inset 4px 0 0 var(--crit)}
.nextstep.done{background:color-mix(in oklab,var(--good) 9%,var(--surface));color:var(--ink);border:1px solid color-mix(in oklab,var(--good) 35%,var(--line));box-shadow:inset 4px 0 0 var(--good)}
.nextstep.open span,.nextstep.done span{opacity:1;color:var(--ink-2)}
.nextstep.open .btn,.nextstep.done .btn{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.nextstep.open .btn:hover,.nextstep.done .btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.g.kp4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kp4 .kpi{grid-column:auto}
.tile{cursor:pointer;transition:border-color .15s,transform .15s;--tone:var(--ink-2)}
.tile:hover,.tile:focus-visible{border-color:var(--tone);transform:translateY(-1px)}
.tile.red{--tone:var(--crit)}.tile.green{--tone:var(--good)}.tile.amber{--tone:var(--amber)}.tile.blue{--tone:var(--accent)}.tile.ink{--tone:var(--ink)}.tile.muted{--tone:var(--ink-3)}
.tile .tl{display:flex;align-items:center;gap:8px}
.tile .ti{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in oklab,var(--tone) 14%,transparent);color:var(--tone);flex:none}
.tile .ti svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile .num{color:var(--tone);margin-top:4px}
.tile.ink .num,.tile.muted .num{color:var(--ink)}
.tile .num small{color:var(--ink-3)}
.tile .foot{color:var(--ink-2)}
.tile .tf{border:0;background:transparent;padding:0;font:inherit;color:var(--ink-2);text-decoration:underline dotted;text-underline-offset:3px}
.tile .tf:hover{color:var(--accent-hi,var(--accent))}
.tile .tgo{position:absolute;right:14px;top:14px;font-size:11px;color:var(--tone);opacity:0;transition:opacity .15s}
.tile:hover .tgo,.tile:focus-visible .tgo{opacity:1}
@media (max-width:1100px){.g.kp4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g.kp4{gap:8px}.kp4 .kpi{padding:12px}.kp4 .kpi .num{font-size:24px}.kp4 .kpi .foot,.tile .tgo{display:none}}

/* ---------- Review: notes, owner and due date on a challenge ---------- */
.drow3{display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:8px}
.drow3 input{border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r-s,8px);padding:8px 10px;font-size:13px;font-weight:400;color:var(--ink)}
.notebox{display:flex;gap:6px;margin-bottom:10px}
.notebox input{flex:1;border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r-s,8px);padding:6px 10px;font-size:12.5px}
.le.note{border-left-style:dashed}
.le.note q{font-style:italic}
.openl li.late small em,.decide .cur em.late{color:var(--crit);font-style:normal;font-weight:600}
.openl li small em,.decide .cur em{font-style:normal}
@media (max-width:640px){.drow3{grid-template-columns:1fr}}
/* Nothing floats over the content: Nordi sits in the header, a tile says where it leads in its own last line */
.top .fab{position:static;box-shadow:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:2px 10px 2px 2px;gap:7px;font-size:12.5px;font-weight:500;border-radius:10px}
.top .fab:hover{transform:none;border-color:var(--ink-3)}
.top .fab .nordi-mini{width:26px;height:26px;border-radius:8px}
.top .fab .fl{display:inline}
@media (min-width:901px) and (max-width:1360px){.top .fab{padding:2px}.top .fab .fl{display:none}}
.tile .tgo{position:static;margin-top:auto;padding-top:2px;opacity:1;color:var(--ink-3)}
.tile:hover .tgo,.tile:focus-visible .tgo{color:var(--tone)}
.tile .tgo::after{content:" \2192"}

/* ---------- Export: share a brief ---------- */
.xbtn span{font-weight:500}
.xwrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:16px}
.xdlg{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;animation:rise .2s}
.xh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.xh h3{margin:0;font-size:16px}.xh p{margin:3px 0 0;font-size:12.5px;color:var(--ink-3)}
.xscope{margin:14px 0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-s,10px);background:var(--surface-2);font-size:13px}
.xscope .lbl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;margin-bottom:3px}
.xscope .muted{display:block;font-size:12px;margin-top:3px}
.xmodes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xmode{text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s,10px);padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.xmode b{font-size:13.5px}.xmode span{font-size:12px;color:var(--ink-2)}
.xmode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.xsecs{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:12px}
.xsec{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 4px;cursor:pointer}
.xsec input{margin-top:3px;accent-color:var(--accent)}.xsec small{display:block;font-size:11.5px;color:var(--ink-3)}
.xfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-size:12px}
.xfoot>div{display:flex;gap:8px}
@media (max-width:640px){.xmodes,.xsecs{grid-template-columns:1fr}.xbtn span{display:none}}
/* Essentials overview: three tiles and the top 10 by importance; a row opens the driver on the 3D car */
.g.kp4.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.nd{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;text-align:left;grid-template-columns:28px minmax(0,1fr) 22px}
.nd-go{width:17px;height:17px;fill:none;stroke:var(--ink-3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;justify-self:end}
.nd:hover .nd-go,.nd:focus-visible .nd-go{stroke:var(--accent)}
@media (max-width:640px){.nd{grid-template-columns:22px minmax(0,1fr) 20px}}

.le .le-x{display:none}
.le.open .le-x,body.analyst .le .le-x{display:block}
body.analyst .le-more{display:none}

/* Copilot: calmer empty state */
.hello{gap:8px;max-width:360px}
.hello .big{width:64px;height:64px;border-radius:18px;padding:4px}

/* The sidebar always fits: it scrolls when the window is short, and gets denser below 860 px height (Analyst has 12 views) */
@media (min-width:901px){

async function loadRowboat(){
  const [quotes, sent] = await Promise.all([getJSON("quotes.json"), getJSON("torque.json")]);
  for(const [path, t] of quotes || []){ const o = path.slice(0, -1).reduce((a, k) => a && a[k], BMW); if(o) o[path.at(-1)] = t; }
  const mark = document.querySelector(".brand .mark");   // brand logo from data/logo.png, also kept out of git
  if(mark && mark.tagName !== "IMG"){ const img = new Image(40, 40); img.className = "mark"; img.alt = "Brand logo"; img.onload = () => mark.replaceWith(img); img.src = "/_rowboat/data/logo.png"; }
  if(sent){ delete sent.generated; rbSent = JSON.stringify(sent); } else rbSent = "";
  await refreshRowboat(true);
  rbQueueSync();
  setInterval(refreshRowboat, 3000);
}
async function refreshRowboat(force){
  const t = await getText("rowboat.json");
  if(t === null || (t === rbSeen && !force)) return;
  rbSeen = t; try{ RB = JSON.parse(t); }catch(e){ return; }
  // never re-render under the cursor: a reason being typed would be lost; the next render picks the notes up
  if(force || !typing({target:document.activeElement})){ render(false); if(openId) renderDrawer(); }
}
function rbExport(){
  const keep = [state.model, state.market], models = {}, reqs = {}, decisions = {};
  for(const r of REQS) reqs[r.id] = {title:r.title, cat:r.cat, motive:r.motive, level:r.ev0.level};
  for(const m of Object.keys(MODELS)){
    state.model = m; const mm = {name:MODELS[m].name, code:MODELS[m].code, markets:{}};
    for(const k of MKS){ if(!sold(k)) continue; state.market = k;
      const rob = robustness();
      mm.markets[k] = {basis:BASIS[basisOf(k)], rows:ranked().map((x, i) => ({id:x.r.id, rank:i + 1, score:Math.round(x.s.total * 10) / 10,
        buy:Math.round(x.s.f.buy), wish:wishOf(x.r), robust:rob[x.r.id]}))};
    }
    models[m] = mm;
    decisions[m] = Object.fromEntries(Object.entries(state.dec[m] || {}).map(([id, d]) => [id, Object.fromEntries(["status","reason","by","at","round","target","accept","ask"].filter(f => d[f] != null).map(f => [f, d[f]]))]));
  }
  [state.model, state.market] = keep;
  return {markets:MK, top:TOP, presets:N_PRESETS, weights:state.wmode, reqs, models, decisions};
}
function rbQueueSync(){ if(!IN_ROWBOAT || rbSent === null) return; clearTimeout(rbTimer); rbTimer = setTimeout(rbPush, 1200); }
async function rbPush(){
  const o = rbExport(), body = JSON.stringify(o);
  if(body === rbSent) return;
  try{
    const r = await fetch("/_rowboat/data/torque.json", {method:"PUT", headers:{"Content-Type":"application/json", "X-Rowboat-App":"1"},
      body:JSON.stringify({generated:new Date().toISOString(), ...o})});
    if(r.ok) rbSent = body;
  }catch(e){}
}

// defects, wants], heat 0 = most criticised part. A market with few comments on this model (China has none) shows all its markets.
const HEAT = [[0,255,32,32],[25,255,122,26],[50,255,230,0],[75,155,226,45],[100,32,214,90]];
function heatHex(v){
  v = Math.max(0, Math.min(100, v)); const i = Math.max(1, HEAT.findIndex(h => v <= h[0])), a = HEAT[i - 1], b = HEAT[i], t = (v - a[0]) / (b[0] - a[0]);
  return `rgb(${[1, 2, 3].map(j => Math.round(a[j] + (b[j] - a[j]) * t)).join(",")})`;
}
function rbPartScope(){

function go(view){
  if(view === "copilot"){ openPanel(); return; }
  let switched = false;
  if(ADV_VIEWS.has(view) && !isAnalyst()){ state.level = "analyst"; switched = true; toast("Switched to Analyst detail."); }
  if(state.view === view){ if(switched){ save(); render(false); } return; }
  state.view = view; save(); render(); window.scrollTo({top:0});
  if(panelOpen) renderMsgs();
}

function audit(e){ state.audit.unshift({at:new Date().toISOString(), id:null, from:"", to:"", model:state.model, ...e}); save(); }
function auditRanks(before, why){
  const after = rankMap(); let n = 0;
  REQS.forEach(r => { if(before[r.id] !== after[r.id]){ audit({id:r.id, type:"priority", from:`#${before[r.id]}`, to:`#${after[r.id]}`, actor:"user:" + state.user, why}); n++; } });
  return n;
}

// One recommendation per undecided requirement, the same rule the essentials view and the drawer use.
function recommendations(){
  const rk = topRank(), net = netEffects(), out = {lock:[], think:[], drop:[]};
  rk.forEach((x, i) => { if(DONE(statusOf(x.r.id))) return; const rc = recoOf(x.r, i + 1, net); if(out[rc.cls] && out[rc.cls].length < 3) out[rc.cls].push({id:x.r.id, why:rc.why}); });
  return out;
}
function recoOf(r, rank = rankMap()[r.id], net = netEffects()){
  const n = net[r.id], wi = wishOf(r), bu = buyOf(r);
  if(!sold(state.market)) return {cls:"check", l:"N/A", why:`Not in the ${mkLabel()} sales plan for the ${mName()}: no buyers to win or lose here.`};
  if(n.net < 0) return {cls:"drop", l:"Offer as option", why:`Loses ${fmtK(-n.loss)}, wins ${fmtK(n.gain)} buyers a year. Offer it as an option instead.`};
  if(wi - bu >= 12) return {cls:"think", l:"Rethink", why:`Asked for ${wi}, but the purchase signal is only ${bu}.`};
  if(revOf(r) >= 12) return {cls:"think", l:"Rethink", why:`${revOf(r)} percent of its comments are about switching it off or overload.`};
  if(confOf(r) >= 55) return {cls:"lock", l:"Put in spec", why:`#${rank}, wins ${sgnK(n.net)} buyers a year with ${confLabel(confOf(r)).toLowerCase()} confidence.`};
  return {cls:"check", l:"Check evidence", why:`Evidence ${r.ev0.level.toLowerCase()}, confidence ${confOf(r)} of 100.`};
}
const RECO_D = {lock:"Make it standard in the successor: owners buy for it, it wins more buyers than it costs, the evidence is solid.",

    why:`${meta.kind === "revert" ? `Reverted decision #${meta.reverts}: ` : meta.kind === "confirm" ? "Confirmed for this round: " : ""}${meta.reason}${next?.ask ? ` · evidence asked from ${next.ask}` : ""}${next?.owner ? ` · owner ${next.owner}` : ""}${next?.due ? ` · due ${next.due}` : ""} (${ctx})`});

function renderDForm(r){

  const R = $("#dR"), S = $("#dSave"), N = $("#dNext"), H = $("#dHint"), T = $("#dT"), A = $("#dA");

  check(); R.focus(); if(pre) R.select();
  const record = goNext => {
    if(S.disabled) return;
    const reason = R.value.trim();

    if(goNext && nxt){ refreshAfterDecision(false); openDrawer(nxt); return; }

  if(N) N.onclick = () => record(true);

function priceChart(cfg, todayUnits){
  const el = $("#simPrice"); if(!el) return;
  const W = 760, H = 230, P = {l:52, r:20, t:12, b:30}, xs = [];
  for(let e = -4000; e <= 12000; e += 1000) xs.push({e, u:simulate(cfg, {extra:e}).units});

/* Procedural car: lofted body from side, plan and section curves */
function mono(pts){
  pts = [...pts].sort((a,b) => a[0] - b[0]);
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), d = [], m = [];
  for(let i = 0; i < n-1; i++) d.push((ys[i+1] - ys[i]) / (xs[i+1] - xs[i]));
  m[0] = d[0]; m[n-1] = d[n-2];
  for(let i = 1; i < n-1; i++) m[i] = d[i-1] * d[i] <= 0 ? 0 : (d[i-1] + d[i]) / 2;
  for(let i = 0; i < n-1; i++){
    if(d[i] === 0){ m[i] = m[i+1] = 0; continue; }
    const a = m[i] / d[i], b = m[i+1] / d[i], s = a*a + b*b;
    if(s > 9){ const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i+1] = t * b * d[i]; }
  }
  return x => {
    if(x <= xs[0]) return ys[0]; if(x >= xs[n-1]) return ys[n-1];
    let i = 0; while(x > xs[i+1]) i++;
    const h = xs[i+1] - xs[i], t = (x - xs[i]) / h, t2 = t*t, t3 = t2*t;
    return (2*t3 - 3*t2 + 1)*ys[i] + (t3 - 2*t2 + t)*h*m[i] + (-2*t3 + 3*t2)*ys[i+1] + (t3 - t2)*h*m[i+1];
  };
}
const smoothstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function buildCar(T, cp, c, mats){
  const lw = c.lwb ? .13 : 0, wb = cp.wb + lw, xFA = wb/2, xRA = -wb/2, xF = xFA + cp.fo, xR = xRA - cp.ro;
  const H = cp.H, W2 = cp.W / 2, drop = c.low ? .015 : 0, WY = .365;

  const top = mono(cp.hatch
    ? [[xR,.84],[xR+.04,1.0],[xR+.13,1.12],[xRr,H-.05],[(xRr+xRf)/2,H],[xRf,H-.03],[xWs,.93],[xFA,.86],[xF-.3,.79],[xF-.08,.71],[xF,.57]]
    : [[xR,.80],[xR+.06,.94],[xR+.25,1.005],[xRw,1.02],[xRr,H-.04],[(xRr+xRf)/2,H],[xRf,H-.03],[xWs,.94],[xFA,.865],[xF-.3,.795],[xF-.08,.72],[xF,.58]]);

  const belt = x => Math.min(belt0(x), top(x) - .02);
  const bot = mono([[xR,.47],[xR+.12,.30],[xR+.45,.20],[xRA,.175],[xFA,.175],[xF-.35,.215],[xF-.08,.31],[xF,.43]]);
  const half = x => {
    const tf = clamp((x - (xF - .42)) / .42, 0, 1), tr = clamp(((xR + .40) - x) / .40, 0, 1), t = Math.max(tf, tr);
    return Math.max(.002, W2 * Math.pow(Math.max(0, 1 - Math.pow(t, 3.2)), 1 / 3.2));
  };
  const gh = x => clamp((top(x) - belt(x) - .06) / .12, 0, 1);
  const ctrl = x => {
    const w = half(x), yb = bot(x), yt = top(x), yB = belt(x), g = gh(x), wr = w * .74;
    const lower = [[0,yb],[w*.78,yb],[w*.965,yb+.06],[w*.995,yb+.2],[w,yB-.32],[w*.985,yB-.11],[w*.95,yB]];
    const hood = [[w*.9,yB+.02],[w*.72,yB+.6*(yt-yB)],[w*.48,yt-.008],[w*.24,yt],[0,yt]];
    const gl = [[w*.885,yB+.035],[wr+(w*.885-wr)*.42,yB+.52*(yt-yB)],[wr,yt-.075],[wr*.55,yt-.012],[0,yt]];
    return lower.concat(hood.map((p,i) => [p[0] + (gl[i][0] - p[0]) * g, p[1] + (gl[i][1] - p[1]) * g]));
  };

  const prof = x => {

// Study entry of a driver for the current model and market (BMW.study: items, ref, code, weak = satisfaction gap 0-100).
const studyOf = (id, market = state.market) => BMW.study[id]?.[state.model]?.[market] || null;
// No owner comments for China: score the parts by the China study of their linked drivers, ranked like the
// comment heat map (0 = biggest gap, 100 = smallest); parts without a study item stay neutral.
function studyOverride(){
  if(state.market !== "CN" || !sold("CN")) return null;
  const per = {};
  for(const id of Object.keys(PART)){ const st = studyOf(id); if(st) PART[id].forEach(p => (per[p] = per[p] || []).push(100 - st.weak)); }
  const avg = Object.fromEntries(Object.entries(per).map(([p, v]) => [p, v.reduce((a, b) => a + b, 0) / v.length]));
  const vals = [...new Set(Object.values(avg).map(v => v.toFixed(3)))].sort((a, b) => a - b);
  const scores = Object.fromEntries(Object.entries(avg).map(([p, v]) => [p, vals.length > 1 ? Math.round(100 * vals.indexOf(v.toFixed(3)) / (vals.length - 1)) : 50]));
  const code = Object.keys(PART).map(id => studyOf(id)?.code).find(Boolean) || M().code;
  return {scores, label:`${M().name} · China · customer study 2025 (${code}), ${Object.keys(scores).length} parts via the purchase drivers`,
    note:"No owner comments for China in the Dataset: parts coloured by the China customer study of their purchase drivers, parts without a study item stay neutral (50)"};
}
function visuSend(extra = {}){

    title:`${M().name} successor · ${mkLabel()}`, override:studyOverride(), ...extra}, location.origin);
}
function optionsHtml(id, partId){
  const code = M().code, o = BMW.options[id]?.[code], seen = new Set(), hits = [];
  for(const p of (id ? PART[id] || [] : [partId]))
    for(const x of VAULT.data?.parts?.[p]?.options?.[code] || [])
      if(!seen.has(x.name) && !(o && o[1] && x.package === o[1])){ seen.add(x.name); hits.push(x); }
  hits.splice(3);
  if(!o && !hits.length) return "";
  return `<div class="fc-opt"><span class="muted">Options today (${code} price list)</span>
    ${o ? `<small><b>${esc(o[0])}</b>${o[1] && o[1] !== "standard" ? " · " + esc(o[1]) : o[1] === "standard" ? " · standard" : ""}${o[2] ? " · " + eur(o[2]) : ""}</small>` : ""}
    ${hits.map(x => `<small>${esc(x.name)} · ${esc(x.availability)}${x.package && x.package !== "unclear" ? " · " + esc(x.package) : ""}${x.price_eur ? " · " + eur(x.price_eur) : ""}</small>`).join("")}</div>`;
}

    ${q ? `<q>${esc(q.text.slice(0, 180))}${q.text.length > 180 ? "…" : ""}</q><small class="muted">${esc(q.type)} · ${esc(q.series)} · ${esc(q.country)}</small>` : ""}

function briefMarkdown(d, mode, secs){

  if(secs.has("decisions")){ L.push(`## Decisions on the top 10 in ${d.market}`, "", "| # | Purchase driver | Recommendation | Decision | Net buyers a year |", "|---|---|---|---|---|");
    d.rows.forEach(r => L.push(`| ${r.rank} | ${r.title} (${r.id}) | ${r.reco} | ${r.status}${r.ask ? ` (${r.ask}${r.owner ? ", " + r.owner : ""}${r.due ? ", due " + r.due : ""})` : ""} | ${expMoney(r.net)} |`));
    if(detailed) d.rows.filter(r => r.reason).forEach(r => L.push("", `- **${r.rank}. ${r.title}**: ${r.reason} (${r.by}, ${expWhen(r.at)})`)); L.push(""); }
  if(secs.has("evidence")){ L.push("## Why customers buy it", ""); d.rows.forEach(r => L.push(`- **${r.rank}. ${r.title}**: purchase signal ${r.buy}, asked for ${r.wish}, evidence ${r.ev}, ${fmt(r.n)} comments. ${r.motive}${r.quote ? ` "${r.quote}" (${r.quoteId})` : ""}`)); L.push(""); }
  if(secs.has("spec")){ L.push("## Target and acceptance criterion", ""); const sp = d.rows.filter(r => ["Approved", "Edited"].includes(r.status)); sp.length ? sp.forEach(r => L.push(`- **${r.rank}. ${r.title}** [${r.status}]`, `  - Target: ${r.target}`, `  - Acceptance: ${r.accept}`)) : L.push("_Nothing approved yet._"); L.push(""); }
  if(secs.has("open")){ L.push("## Open evidence requests", ""); d.openReq.length ? d.openReq.forEach(o => L.push(`- **${o.title}**: ${o.ask || "evidence"}${o.owner ? ", " + o.owner : ""}${o.due ? ", due " + o.due : ""}${o.overdue ? " (overdue)" : ""}. ${o.reason}`)) : L.push("_Nothing is waiting for evidence._"); L.push(""); }
  if(secs.has("markets")){ L.push("## Sales upside by market", "", "| Market | Extra buyers a year | vs today | Plan 2030 | Strongest drivers |", "|---|---|---|---|---|"); d.markets.forEach(m => L.push(`| ${m.name}${m.modelled ? " (modelled)" : ""} | ${expMoney(m.up)} | ${m.pct >= 0 ? "+" : ""}${m.pct.toFixed(1)} % | ${fmtK(m.plan)} | ${m.drivers.join(", ")} |`)); L.push(""); }
  if(secs.has("log")){ L.push("## Review log", ""); d.log.length ? d.log.forEach(l => L.push(`- ${expWhen(l.at)} ${l.title || l.id}: ${l.kind === "note" ? "note" : l.kind === "confirm" ? "kept" : `${l.from} → ${l.to}`}. ${l.reason} (${l.by})`)) : L.push("_No decisions yet._"); L.push(""); }
  L.push("_Torque Decision Cockpit, prototype. BMW hackathon data; customer types of the choice model and the competitor benchmark are modelled; names in quotes masked._");

}

// As a Claude artifact the copilot runs on Claude, inside Rowboat on the model set in Rowboat, otherwise it answers offline from the data.
const AI_NAME = IN_ROWBOAT ? "Rowboat" : "Claude";
async function rowboatSample(input, opts = {}){
  const messages = typeof input === "string" ? [{role:"user", content:input}] : input;
  // No signal on the fetch itself, Stop ends the wait instead. The Rowboat model sometimes returns an empty text, so ask up to three times.
  const stopped = new Promise((_, no) => opts.signal && opts.signal.addEventListener("abort", () => no({code:"cancelled"}), {once:true}));
  for(let attempt = 0; attempt < 3; attempt++){
    let res, j = {};
    try{
      res = await Promise.race([fetch("/_rowboat/llm/generate", {method:"POST", headers:{"Content-Type":"application/json", "X-Rowboat-App":"1"}, body:JSON.stringify({messages, maxOutputTokens:1500})}), stopped]);
      j = await Promise.race([res.json().catch(() => ({})), stopped]);
    }catch(e){ throw {code:e && e.code === "cancelled" ? "cancelled" : "upstream_error"}; }
    if(!res.ok){ const c = j.error && j.error.code; throw {code:res.status === 429 ? "rate_limited" : ["llm_not_configured", "model_not_allowed", "capability_not_declared"].includes(c) ? "not_granted" : "upstream_error"}; }
    const text = String(j.text || "");
    if(text){ if(opts.onText) opts.onText({text, delta:text}); return {text, truncated:false}; }
  }
  throw {code:"empty_completion"};
}

function clean(t){ return String(t).replace(/\s[\u2014\u2013]\s/g, ", ").replace(/[\u2014\u2013]/g, " "); }
function mdLite(t){
  t = String(t).replace(/\s*\[S\d+(?:\s*,\s*S?\d+)*\]/g, "").replace(/\s*\((?:e\.g\.\s*)?(?:[FG]\d{2}-\d{4}(?:,\s*)?)+\)/g, "");
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\bR-(\d{2})\b/g, m => RBY[m] ? `<button type="button" class="rid" data-open="${m}">${m}</button>` : m);
  const lines = esc(clean(t)).split(/\n/); let html = "", ul = false;
  for(const raw of lines){ const l = raw.trim();
    if(/^([-*•]|\d+\.)\s+/.test(l)){ if(!ul){ html += "<ul>"; ul = true; } html += `<li>${inline(l.replace(/^([-*•]|\d+\.)\s+/, ""))}</li>`; }
    else { if(ul){ html += "</ul>"; ul = false; } if(l) html += `<p>${inline(l.replace(/^#+\s*/, ""))}</p>`; } }
  if(ul) html += "</ul>"; return html;
}

const VOICE = {rec:null, chunks:[], timer:0, audio:null, speak:(() => { try{ return localStorage.getItem("torque.voice") === "1"; }catch(e){ return false; } })()};

const blobB64 = b => new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(",")[1] || ""); fr.onerror = no; fr.readAsDataURL(b); });

async function micToggle(){
  if(VOICE.rec){ VOICE.rec.stop(); return; }

  catch(e){ toast("No microphone access. Allow the microphone for Torque and try again."); return; }
  const type = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  const rec = new MediaRecorder(stream, type ? {mimeType:type} : undefined);
  VOICE.rec = rec; VOICE.chunks = [];

  rec.onstop = async () => {

    const blob = new Blob(VOICE.chunks, {type:rec.mimeType || "audio/webm"});

// The RAG backend (src/rag_backend, feat/ehl-search) indexes the whole Dataset as Markdown chunks in Qdrant.
// Nordi retrieves for every question: chunks of the current model plus the best chunks overall.
const RAG_URL = (() => { try{ return localStorage.getItem("torque.rag") || "http://127.0.0.1:8100"; }catch(e){ return "http://127.0.0.1:8100"; } })();
const RAG = {online:null};
async function ragSearch(question, filters, top_k){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
  try{
    const r = await fetch(RAG_URL + "/search", {method:"POST", headers:{"Content-Type":"application/json"}, signal:ctl.signal,
      body:JSON.stringify({question, top_k, ...(filters ? {filters} : {})})});
    if(!r.ok) throw new Error("rag " + r.status);
    RAG.online = true; return (await r.json()).results || [];
  }catch(e){ RAG.online = false; return null; }
  finally{ clearTimeout(t); }
}
async function ragContext(question){
  const q = `${question} (BMW ${M().name}, ${M().code}, market ${mkLabel()})`;
  const [own, all] = await Promise.all([ragSearch(q, {vehicle_model:M().code}, 6), ragSearch(q, null, 4)]);
  if(own === null && all === null) return null;
  const seen = new Set(), hits = [];
  for(const h of [...(own || []), ...(all || [])]) if(!seen.has(h.chunk_id)){ seen.add(h.chunk_id); hits.push(h); }
  return hits.slice(0, 8).map((h, i) => ({n:i + 1, source:[h.source_type, h.vehicle_model, h.market, h.section].filter(Boolean).join(", "),
    file:h.source_file || "", text:String(h.text || "").replace(/^---[\s\S]*?---\s*/, "").slice(0, 2400)}));
}
const ragRules = hits => hits && hits.length ? `\nRETRIEVED (RAG over the whole BMW Dataset: feedback, customer studies, sales, option lists). Use these passages as background next to DATA. Do not cite them, do not mark them like [S1], do not name files or chunks.\n${hits.map(h => `[S${h.n}] ${h.source} (${h.file})\n${h.text}`).join("\n\n")}` : "";

async function ask(text){

  const stop = $("#cstop"), send = $("#csend"); if(stop) stop.hidden = false; if(send) send.disabled = true;
  const fn = await samplePromise;
  const bodyEl = () => $(`#msgs .msg.ai[data-i="${chat.indexOf(ai)}"] .body`);
  if(fn && sampleFn){
    chatCtl = new AbortController();
    const turns = chat.filter(m => m !== ai && !m.offline && m.content).slice(-8).map(m => ({role:m.role, content:m.content}));
    while(turns.length && turns[0].role !== "user") turns.shift();
    try{

      const hits = await ragContext(text);
      ai.sources = hits || []; ai.meta = "";
      const res = await sampleFn([{role:"user", content:RULES() + ragRules(hits)}, ...turns], {cache:false, modelTier:"quick", signal:chatCtl.signal,
        onText:({text}) => { ai.content = text; const b = bodyEl(); if(b) b.innerHTML = mdLite(text); const box = $("#msgs"); if(box) box.scrollTop = box.scrollHeight; }});
      ai.content = res.text; ai.meta = `Live answer · ${AI_NAME}` + (res.truncated ? " · cut short" : "")
        ;

      else { ai.content = (e && e.text) ? e.text : fallbackAnswer(text); ai.meta = aiErr(code) + (e && e.text ? "" : " Showing the offline answer."); ai.offline = !(e && e.text); }

  $("#cpAv").innerHTML = nordi("wave");
  const inp = $("#cin");
  const grow = () => { inp.style.height = "auto"; inp.style.height = Math.min(140, inp.scrollHeight) + "px"; };
  inp.addEventListener("input", grow);
  inp.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#cform").requestSubmit(); } });
  $("#cform").onsubmit = e => { e.preventDefault(); const t = inp.value; inp.value = ""; grow(); ask(t); };
  $("#cstop").onclick = () => { chatCtl?.abort(); stopSpeaking(); };
  $("#cmic").onclick = micToggle;
  $("#cspk").onclick = () => { VOICE.speak = !VOICE.speak; try{ localStorage.setItem("torque.voice", VOICE.speak ? "1" : "0"); }catch(e){} if(!VOICE.speak) stopSpeaking(); speakerUI(); };
  speakerUI();
  $("#cpClose").onclick = closePanel;
  $("#cpNew").onclick = () => { if(busy) chatCtl?.abort(); chat = []; renderMsgs(); inp.focus(); };
  $("#cpctx").addEventListener("toggle", e => { ctxOpen = e.target.open; });
  renderMsgs(); updateAIStatus();
}

/* ---------- Command palette ---------- */
let palItems = [], palSel = 0;
function palCommands(){
  const v = Object.entries(VIEWS).map(([k, x]) => ({l:`Go to ${x.n}`, g:"View", run:() => go(k)}));
  const r = ranked().map((x, i) => ({l:`${x.r.id} ${x.r.title}`, g:`#${i + 1} · ${STATUS[statusOf(x.r.id)].l}`, run:() => openDrawer(x.r.id)}));
  const a = [
    {l:`Start review of the open top ${TOP}`, g:"Action", run:startReview},
    {l:"Open the review log", g:"View", run:() => go("log")},
    {l:"Start a new review round", g:"Action", run:() => { go("log"); setTimeout(() => startRound(), 100); }},
    ...MKS.filter(k => sold(k)).map(k => ({l:`Market: ${MK[k]}`, g:"Filter", run:() => setMarket(k)})),
    ...Object.entries(MODELS).map(([k, m]) => ({l:`Successor of the ${m.name}`, g:"Model", run:() => setModel(k)})),
    {l:"Detail: Essentials", g:"Display", run:() => setLevel("essentials")}, {l:"Detail: Analyst", g:"Display", run:() => setLevel("analyst")},
    {l:"Weights learned from data", g:"Ranking", run:() => { state.wmode = "derived"; save(); render(false); }},
    {l:"Open the showroom", g:"Concept 3D", run:() => { go("concept"); setTimeout(() => $("#showroomBtn")?.click(), 400); }},
    {l:"Reset the simulator to the proposed spec", g:"Simulator", run:() => { delete state.simcfg[state.model]; save(); go("sim"); }},
    {l:`Export the top ${TOP} purchase drivers (JSON)`, g:"Export", run:exportList},
    {l:"Open the audit trail", g:"View", run:() => go("audit")},
    {l:"Copy the spec for the steering board", g:"Export", run:async () => { try{ await navigator.clipboard.writeText(specMarkdown()); toast("Spec copied as Markdown."); }catch(e){ go("log"); } }},
    {l:"Take the tour with Nordi", g:"Help", run:() => tourShow(0)},
    {l:"Switch theme", g:"Display", run:toggleTheme},
  ];
  return [...a, ...r, ...v];
}
function openPal(){ $("#pal").hidden = false; $("#palIn").value = ""; palFilter(); setTimeout(() => $("#palIn").focus(), 10); }
function closePal(){ $("#pal").hidden = true; }
function palFilter(){
  const q = $("#palIn").value.toLowerCase().split(/\s+/).filter(Boolean);
  palItems = palCommands().filter(c => q.every(t => (c.l + " " + c.g).toLowerCase().includes(t))).slice(0, 14); palSel = 0; palDraw();
}
function palDraw(){
  $("#palList").innerHTML = palItems.length ? palItems.map((c, i) => `<li role="option" data-pi="${i}" aria-selected="${i === palSel}"><span>${esc(c.l)}</span><small>${esc(c.g)}</small></li>`).join("") : `<li class="muted">No match</li>`;
  const s = $(`#palList [aria-selected="true"]`); if(s) s.scrollIntoView({block:"nearest"});
}
function palRun(i){ const c = palItems[i]; if(!c) return; closePal(); c.run(); }

/* ---------- Tooltip, toast ---------- */
const tip = {
  el:null,
  show(html, x, y){ const t = this.el; t.innerHTML = html; t.classList.add("on");
    const w = t.offsetWidth, h = t.offsetHeight; let L = x + 14, T = y + 14;
    if(L + w > innerWidth - 8) L = x - w - 14; if(T + h > innerHeight - 8) T = y - h - 14;
    t.style.left = Math.max(8, L) + "px"; t.style.top = Math.max(8, T) + "px"; },
  hide(){ this.el.classList.remove("on"); },
};
let toastT = null;
function toast(msg, undo){
  const t = $("#toast"); t.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button type="button" id="undoBtn">Undo</button>` : ""}`; t.classList.add("on");
  if(undo) $("#undoBtn").onclick = () => { t.classList.remove("on"); undo(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), undo ? 6000 : 2600);
}

/* ---------- Tour with Nordi ---------- */
const TOUR = [
  {view:"overview", target:"#t-reco", mood:"wave", title:"Hi, I'm Nordi", text:() => `Torque turns ${fmt(BMW.issues.unique)} real BMW customer comments, two customer studies, the sales plan and the option lists into the top ${TOP} purchase drivers for the ${M().name} successor in each market, and suggests what to put in the spec, what to rethink and what to offer as an option.`},
  {view:"overview", target:"#t-reco", mood:"think", title:"Buy beats wish", text:() => `The top ${TOP} are built from what owners praise and buy for, not from what they ask for, and from how many buyers each feature wins and loses in ${mkLabel()}. Switch the model or the market and the list follows.`},
  {view:"log", target:"#t-log", mood:"think", title:"Every decision is traceable", text:() => "The review log shows what changed, why and by whom, with the data at that moment. You can revert with a reason, and a new review round brings decisions back for a second look. Switch to Analyst for the simulator, the evidence and the audit trail."},
  {view:"concept", target:"#stage", mood:"cheer", title:"See the car", text:() => "Every decision changes the concept car. Click a pin to focus a driver, or open the showroom for the pitch."},
  {panel:true, target:"#cform", mood:"wave", title:"Ask me anything", text:() => "I am one click away on every page and know the view you are on. I answer from the data on screen and cite driver and comment IDs. Every change lands in the audit trail, ready for the steering board."},
];
function tourShow(i){
  tourStep = i; $$(".spot").forEach(el => el.classList.remove("spot"));
  const s = TOUR[i];
  if(tourPanel && !(s && s.panel)){ tourPanel = false; closePanel(); }
  if(!s){ tourStep = -1; $("#coach").hidden = true; $("#coach").classList.remove("beside"); markIntroSeen(); save(); renderNav(); return; }
  if(openId) closeDrawer();
  if(s.panel){ if(!panelOpen){ tourPanel = true; openPanel(false); } }
  else if(state.view !== s.view){ state.view = s.view; render(); }
  $("#coach").classList.toggle("beside", !!s.panel);
  renderNav();
  setTimeout(() => { const tg = $(s.target); if(tg){ tg.classList.add("spot"); tg.scrollIntoView({block:"center", behavior:"smooth"}); } }, 80);
  const c = $("#coach"); c.hidden = false;
  c.innerHTML = `<div class="nb">${nordi(s.mood)}</div><div><small>${i + 1} of ${TOUR.length}</small><h4>${s.title}</h4><p>${s.text()}</p></div>
    <div class="acts"><div class="dots">${TOUR.map((_, j) => `<i class="${j === i ? "on" : ""}"></i>`).join("")}</div><div style="display:flex;gap:6px">
    <button type="button" class="btn" data-t="skip">${i === TOUR.length - 1 ? "Close" : "Skip"}</button>${i ? `<button type="button" class="btn" data-t="back">Back</button>` : ""}<button type="button" class="btn primary" data-t="next">${i === TOUR.length - 1 ? "Start working" : "Next"}</button></div></div>`;
  $$("[data-t]", c).forEach(b => b.onclick = () => { const a = b.dataset.t;
    if(a === "next" && i === TOUR.length - 1){ tourShow(-1); state.view = "overview"; save(); render(); return; }
    if(a === "next") tourShow(i + 1); else if(a === "back") tourShow(i - 1); else tourShow(-1); });
}

/* ---------- Global controls ---------- */
function applyTheme(){ if(state.theme) document.documentElement.setAttribute("data-theme", state.theme); else document.documentElement.removeAttribute("data-theme"); }
function isDark(){ return state.theme ? state.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function toggleTheme(){ state.theme = isDark() ? "light" : "dark"; applyTheme(); save(); if(state.view === "concept") render(false); }
function setMarket(k){ if(k === state.market || !sold(k)) return; baseRanks = rankMap(); state.market = k; save(); render(false); if(openId) renderDrawer(); }
function setModel(k){ if(k === state.model || !MODELS[k]) return; baseRanks = null; state.model = k; if(!sold(state.market)) state.market = bestMk(); save(); render(false); if(openId) renderDrawer(); }
function setLevel(k){
  if(k === state.level) return;
  state.level = k;
  if(k === "essentials" && ADV_VIEWS.has(state.view)) state.view = "overview";
  save(); render(false); if(openId) renderDrawer();
  toast(k === "analyst" ? "Analyst: all views, the score, evidence details and the audit trail." : "Essentials: what to decide, why, and what was decided.");
}
const typing = e => e.target && (e.target.closest("input,textarea,select,[contenteditable]"));

function init(){
  load(); applyTheme();
  if(!MODELS[state.model]) state.model = MODELS["5"] ? "5" : Object.keys(MODELS)[0];
  if(!MKS.includes(state.market) || !sold(state.market)) state.market = bestMk();
  if(!Array.isArray(state.audit) || !state.audit.length) state.audit = seedAudit();
  tip.el = $("#tip");
  $("#tourIcon").innerHTML = nordi("wave"); $("#fabIcon").innerHTML = nordi("wave");
  if(state.view === "copilot") state.view = "overview";
  initCopilot();
  document.addEventListener("click", e => {
    const rb = e.target.closest("[data-rb]"); if(rb){ rbOpen(rb.dataset.rb); return; }
    const c3 = e.target.closest("[data-3d]"); if(c3){ focusPin = c3.dataset["3d"]; if(openId) closeDrawer(); go("concept"); window.scrollTo({top:0}); return; }
    const v = e.target.closest("[data-view]"); if(v){ if(tourStep >= 0) tourShow(-1); go(v.dataset.view); return; }
    const g = e.target.closest("[data-go]"); if(g){ if(openId) closeDrawer(); go(g.dataset.go); return; }
    const act = e.target.closest("[data-act]"); if(act && act.dataset.act === "review"){ startReview(act.dataset.only); return; }
    const mo = e.target.closest("[data-model]"); if(mo){ setModel(mo.dataset.model); return; }
    const mk = e.target.closest("[data-market]"); if(mk){ setMarket(mk.dataset.market); return; }
    const lv = e.target.closest("[data-level]"); if(lv){ setLevel(lv.dataset.level); return; }
    const a = e.target.closest("[data-ask]"); if(a){ if(openId) closeDrawer(); if(state.view !== "copilot") go("copilot"); ask(a.dataset.ask); return; }
    const o = e.target.closest("[data-open]"); if(o){ openDrawer(o.dataset.open); return; }
  });
  $("#scrim").onclick = closeDrawer;
  $("#fab").onclick = () => go("copilot");
  $("#tourBtn").onclick = () => tourShow(0);
  $("#themeBtn").onclick = toggleTheme;
  $("#palBtn").onclick = openPal;
  $("#pal").addEventListener("click", e => { if(e.target.id === "pal") closePal(); const li = e.target.closest("[data-pi]"); if(li) palRun(+li.dataset.pi); });
  $("#palIn").addEventListener("input", palFilter);
  $("#palIn").addEventListener("keydown", e => {
    if(e.key === "ArrowDown"){ palSel = Math.min(palItems.length - 1, palSel + 1); palDraw(); e.preventDefault(); }
    else if(e.key === "ArrowUp"){ palSel = Math.max(0, palSel - 1); palDraw(); e.preventDefault(); }
    else if(e.key === "Enter"){ palRun(palSel); e.preventDefault(); }
    else if(e.key === "Escape"){ closePal(); e.preventDefault(); }
  });
  document.addEventListener("keydown", e => {
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#pal").hidden ? openPal() : closePal(); return; }
    if(!$("#pal").hidden) return;
    if((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('div[role="button"][data-open]')){ e.preventDefault(); openDrawer(e.target.dataset.open); return; }
    if(e.key === "Escape"){ if(g3 && g3.escape && g3.escape()) return; if(openId) closeDrawer(); else if(tourStep >= 0) tourShow(-1); else if(panelOpen) closePanel(); return; }
    if(openId && !typing(e) && !e.metaKey && !e.ctrlKey && !e.altKey){
      if(e.key === "ArrowRight"){ stepDrawer(1); e.preventDefault(); }
      else if(e.key === "ArrowLeft"){ stepDrawer(-1); e.preventDefault(); }
      else if(/^[aemcrk]$/i.test(e.key)){ setDecMode({a:"approved", e:"modified", m:"modified", c:"challenged", r:"rejected", k:"keep"}[e.key.toLowerCase()]); e.preventDefault(); }
      return;
    }
    if(!typing(e) && e.key === "/" ){ e.preventDefault(); openPal(); }
  });
  document.addEventListener("pointerover", e => { const t = e.target.closest && e.target.closest("[data-tip]"); if(t) tip.show(t.dataset.tip, e.clientX, e.clientY); });
  document.addEventListener("pointermove", e => { const t = e.target.closest && e.target.closest("[data-tip]"); if(t) tip.show(t.dataset.tip, e.clientX, e.clientY); else if(!(e.target.closest && e.target.closest("#trend"))) tip.hide(); });
  document.addEventListener("scroll", () => tip.hide(), true);
  if(!VIEWS[state.view]) state.view = "overview";
  render();
  if(!introSeen()){ markIntroSeen(); setTimeout(() => tourShow(0), 600); }
  if(IN_ROWBOAT){
    loadRowboat();
    // Rowboat announces every write to data/ (ours too); never reload the page for it, just read the vault snapshot again.
    window.addEventListener("rowboat:data-change", e => { e.preventDefault(); if(/rowboat\.json$/.test((e.detail && e.detail.path) || "")) refreshRowboat(); });
  }
}
init();

</script>
