<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Torque Decision Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Saira+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --disp:"Saira Semi Condensed","Instrument Sans",system-ui,sans-serif;
  --bg:#f3f3f0;--surface:#ffffff;--surface-2:#f7f7f5;--line:#e6e5e0;--line-2:#d5d4ce;
  --ink:#0b0b0b;--ink-2:#52514e;--ink-3:#7c7b75;
  --accent:#2f5fe8;--accent-2:#2449c4;--accent-soft:#e9eefc;--on-accent:#ffffff;
  --side:#0e1012;--side-2:#181b1f;--side-line:#24282d;--side-ink:#ecebe7;--side-ink-2:#9c9b95;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s7:#6250d6;
  --pos:#2a78d6;--neg:#e34948;--mid:#f0efec;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;
  --h0:#eef4fc;--h1:#cde2fb;--h2:#9ec5f4;--h3:#6da7ec;--h4:#3987e5;--h5:#256abf;--h6:#184f95;--heat-strong:#ffffff;
  --stage-a:#ffffff;--stage-b:#e7e7e2;
  --scrim:rgba(12,12,12,.32);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.07);
  --r:14px;--r-s:6px;--accent-hi:#2f5fe8;--amber:#c98500;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c0b;--surface:#171716;--surface-2:#1e1e1d;--line:#2a2a28;--line-2:#3a3a37;
    --ink:#f0efec;--ink-2:#c3c2b7;--ink-3:#8f8e87;
    --accent:#4b70f0;--accent-2:#6f8ff5;--accent-soft:#1b2440;--on-accent:#ffffff;
    --side:#080909;--side-2:#131518;--side-line:#202327;
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s7:#9085e9;
    --pos:#3987e5;--neg:#e66767;--mid:#383835;
    --h0:#1a222e;--h1:#1b3152;--h2:#184f95;--h3:#256abf;--h4:#3987e5;--h5:#6da7ec;--h6:#9ec5f4;--heat-strong:#0b0b0b;
    --stage-a:#2a2b2f;--stage-b:#0e0e0f;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.45);
    --accent-hi:#6f8ff5;--amber:#d99a1a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c0b;--surface:#171716;--surface-2:#1e1e1d;--line:#2a2a28;--line-2:#3a3a37;
  --ink:#f0efec;--ink-2:#c3c2b7;--ink-3:#8f8e87;
  --accent:#4b70f0;--accent-2:#6f8ff5;--accent-soft:#1b2440;--on-accent:#ffffff;
  --side:#080909;--side-2:#131518;--side-line:#202327;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s7:#9085e9;
  --pos:#3987e5;--neg:#e66767;--mid:#383835;
  --h0:#1a222e;--h1:#1b3152;--h2:#184f95;--h3:#256abf;--h4:#3987e5;--h5:#6da7ec;--h6:#9ec5f4;--heat-strong:#0b0b0b;
  --stage-a:#2a2b2f;--stage-b:#0e0e0f;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.45);
  --accent-hi:#6f8ff5;--amber:#d99a1a;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-3)}
body:not(.analyst) .adv{display:none!important}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px 14px;gap:16px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px;cursor:pointer;border-radius:var(--r-s)}
.brand:hover b{color:var(--accent-hi)}
.brand svg{width:32px;height:32px;flex:none}
.brand b{font:700 19px/1 var(--disp);letter-spacing:.02em;display:block}
.brand small{display:block;font-size:11px;color:var(--side-ink-2);margin-top:3px}
.brand .mark{width:34px;height:34px;flex:none;display:block;border-radius:9px}
.brand .env{display:inline-block;margin-top:5px;padding:1px 7px;line-height:1.3;border:1px solid var(--side-line);border-radius:999px;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--side-ink-2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-ink-2);padding:12px 10px 4px;font-weight:600}
.nav .grp:first-child{padding-top:0}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--side-ink-2);padding:8px 10px;border-radius:9px;font-weight:500;font-size:13.5px;text-align:left;white-space:nowrap}
.nav button svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--side-2);color:var(--side-ink)}
.nav button[aria-current="page"]{background:var(--side-2);color:var(--side-ink);box-shadow:inset 2px 0 0 #6f8ff5}
.nav .count{margin-left:auto;font:500 11px var(--mono);color:var(--side-ink-2);background:var(--side-line);padding:1px 6px;border-radius:6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.mini-pipe{border:1px solid var(--side-line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--side-ink-2)}
.mini-pipe .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.mini-pipe .bar{height:4px;border-radius:4px;background:var(--side-line);margin-top:8px;overflow:hidden}
.mini-pipe .bar i{display:block;height:100%;background:#6f8ff5;border-radius:4px;transition:width .5s}
.side-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--side-line);background:transparent;color:var(--side-ink);padding:7px 10px;border-radius:10px;font-size:12.5px}
.side-btn:hover{background:var(--side-2)}
.side-btns{display:flex;gap:6px}
.side-btns .side-btn{flex:1;justify-content:center}
.nordi-mini{width:22px;height:22px;flex:none;background:#efeee9;border-radius:7px;padding:1px;display:inline-block}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:15;background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;gap:12px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.crumb h1{margin:0;font:600 22px/1.15 var(--disp);letter-spacing:.005em}
.crumb p{margin:3px 0 0;color:var(--ink-3);font-size:12.5px}
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctrl{display:flex;align-items:center;gap:8px}
.ctrl>span{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-weight:500;font-size:12.5px;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.searchbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;color:var(--ink-3);font-size:12.5px}
.searchbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.searchbtn kbd{font:500 11px var(--mono);border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;line-height:1.3;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--s7)}
.chip.synth{border-style:dashed}
.view{padding:24px 28px 96px;width:100%;max-width:1480px}
.view>*+*{margin-top:16px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view.enter>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.04s}.view.enter>*:nth-child(3){animation-delay:.08s}.view.enter>*:nth-child(4){animation-delay:.12s}

/* Cards and grid */
.g{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card h3{margin:0;font-size:14px;font-weight:600;letter-spacing:.005em}
.card .sub{margin:3px 0 0;color:var(--ink-3);font-size:12px}
.link{border:0;background:transparent;color:var(--accent);font-weight:500;font-size:12.5px;padding:2px 0}
.link:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:9px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:12.5px;color:var(--ink-2);margin:8px 0 0}
.empty{padding:30px;text-align:center;color:var(--ink-3);font-size:13px}

/* Next step banner */
.nextstep{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:var(--r);background:var(--ink);color:var(--surface)}
.nextstep .nb{width:44px;height:44px;flex:none;background:#efeee9;border-radius:12px;padding:3px}
.nextstep div{flex:1;min-width:0}
.nextstep b{display:block;font-size:14.5px}
.nextstep span{font-size:12.5px;opacity:.75}
.nextstep .btn{background:var(--surface);color:var(--ink);border-color:var(--surface)}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .lbl{font-size:12px;color:var(--ink-3);font-weight:500}
.kpi .num{font:600 34px/1 var(--disp);letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.kpi .num small{font-size:19px;color:var(--ink-3);font-weight:500}
.kpi .foot{font-size:12px;color:var(--ink-2)}
.delta-chip{display:inline-flex;align-items:center;gap:3px;font:600 12px var(--mono);padding:1px 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}

/* Recommendation */
.reco{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.reco .col h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px}
.reco .col h4 svg{width:15px;height:15px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.reco .lock h4 svg{stroke:var(--good)}.reco .think h4 svg{stroke:#c98500}.reco .drop h4 svg{stroke:var(--crit)}
.ri{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.ri:hover{border-color:var(--line-2)}
.ri b{font-size:13px;display:block}
.ri span{font-size:12px;color:var(--ink-2);display:block;margin-top:2px}

/* Funnel and pipeline */
.funnel{display:flex;flex-direction:column;gap:9px}
.frow{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 74px;gap:12px;align-items:center}
.frow .fl{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .ft{height:22px;position:relative}
.frow .fb{height:100%;border-radius:2px 4px 4px 2px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.frow .fv{font:500 12.5px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.pipe{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;position:relative;padding-bottom:14px}
.step:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--line)}
.step .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--surface)}
.step .ic svg{width:15px;height:15px;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke:var(--good)}
.step.now .ic{border-color:var(--accent)}
.step.now .ic::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--accent) 50%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.step h4{margin:3px 0 0;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.step h4 em{font-style:normal;font-weight:500;font-size:11.5px;color:var(--ink-3)}
.step p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2)}

/* Heatmap */
.heat{width:100%;border-collapse:separate;border-spacing:2px;font-size:12.5px}
.heat th{font-weight:600;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:4px 6px;text-align:center}
.heat th:first-child{text-align:left}
.heat th.sel{color:var(--ink)}
.heat td{padding:0}
.heat td.rl{padding:5px 8px 5px 0;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}
.heat td.rl button{border:0;background:transparent;padding:0;text-align:left;color:var(--ink);font-size:12.5px}
.heat td.rl button:hover{color:var(--accent)}
.heat td.rl .mono{color:var(--ink-3);font-size:11px;margin-right:6px}
.hc{height:28px;border-radius:4px;display:grid;place-items:center;font:500 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);cursor:default}
.hc.h0{background:var(--h0)}.hc.h1{background:var(--h1)}.hc.h2{background:var(--h2)}.hc.h3{background:var(--h3)}
.hc.h4{background:var(--h4);color:var(--heat-strong)}.hc.h5{background:var(--h5);color:var(--heat-strong)}.hc.h6{background:var(--h6);color:var(--heat-strong)}

/* Lists */
.toplist{display:flex;flex-direction:column}
.trow{cursor:pointer;display:grid;grid-template-columns:22px 44px minmax(0,1fr) 74px 40px 22px;gap:10px;align-items:center;padding:9px 6px;border-radius:9px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--surface-2)}
.trow .n{font:600 15px var(--disp);color:var(--ink-3)}
.trow .t{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .v{font:500 12.5px var(--mono);text-align:right}
.rid{font:500 11.5px var(--mono);color:var(--ink-3)}
button.rid,.ridlink{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:0 5px;color:var(--ink);font:500 11.5px var(--mono);cursor:pointer}
button.rid:hover,.ridlink:hover{border-color:var(--accent);color:var(--accent)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.st svg{width:15px;height:15px;flex:none;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.st.approved svg{stroke:var(--good)}.st.modified svg{stroke:#c98500}.st.rejected svg{stroke:var(--crit)}.st.open svg{stroke:var(--ink-3)}.st.challenged svg{stroke:var(--s7)}
.st.icon-only span{display:none}
.netv{font:600 12.5px var(--mono);white-space:nowrap}
.netv.pos{color:var(--ink)}.netv.neg{color:var(--neg)}
.netv.pos::before{content:"+"}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{cursor:pointer;display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);text-align:left;width:100%}
.alert:hover{border-color:var(--line-2)}
.alert svg{width:18px;height:18px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.alert.conf svg{stroke:#c98500}.alert.low svg{stroke:var(--s7)}
.alert b{font-weight:600;font-size:13px}
.alert p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.alert .tag{font-size:11px;color:var(--ink-3);white-space:nowrap}
.ticks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.ticks li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:12.5px;color:var(--ink-2)}
.ticks svg{width:16px;height:16px;fill:none;stroke:var(--ink-2);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}

/* Bars */
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 52px;gap:12px;align-items:center;font-size:12.5px}
.hb .l{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:14px;position:relative}
.hb .tr i{display:block;height:100%;border-radius:2px 4px 4px 2px;background:var(--s1);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hb .v{font:500 12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.hb.neutral .tr i{background:var(--ink-3)}
.div{display:flex;flex-direction:column;gap:6px}
.dv{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 78px;gap:12px;align-items:center;font-size:12.5px}
.dv .l{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.dv .tr{position:relative;height:16px}
.dv .tr .ax{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-2)}
.dv .tr i{position:absolute;top:0;height:100%}
.dv .tr i.p{left:50%;background:var(--pos);border-radius:2px 4px 4px 2px}
.dv .tr i.n{right:50%;background:var(--neg);border-radius:4px 2px 2px 4px}
.dv .tr b.net{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink)}
.dv .v{font:600 12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.fchip:hover{border-color:var(--ink-3)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:3px;border-radius:2px;width:14px;vertical-align:3px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--font);fill:var(--ink-3);font-size:11px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .axis{stroke:var(--line-2);stroke-width:1}
svg.chart .dl{fill:var(--ink-2);font-size:11.5px;font-weight:500}
svg.chart .xh{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
svg.chart .qlab{fill:var(--ink-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
svg.chart .ptl{fill:var(--ink);font-size:11.5px;font-weight:500}

/* Feed */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface);min-width:200px;flex:1;max-width:340px}
.search svg{width:15px;height:15px;fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:13px}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.fd{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.fd q{font-size:13.5px;line-height:1.45;quotes:"\201C" "\201D"}
.fd .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fd .cls{border-top:1px dashed var(--line-2);padding-top:9px;font-size:12px;color:var(--ink-2);display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.fd .cls span:nth-child(odd){color:var(--ink-3)}
.pol{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-2)}
.pol b{font:600 12px var(--mono)}
.insights{display:flex;flex-direction:column;gap:12px}
.ins{border-left:3px solid var(--line-2);padding:2px 0 2px 12px}
.ins b{display:block;font-size:13px}
.ins p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2)}
.ins.hidden-driver{border-color:var(--pos)}.ins.trap{border-color:var(--neg)}
.research{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-size:12px;color:var(--ink-2)}
.research p{margin:0 0 6px}
.research a{color:var(--accent)}

/* Dumbbell */
.db{display:flex;flex-direction:column;gap:4px}
.dbr{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 180px;gap:14px;align-items:center;padding:5px 0}
.dbr .l{font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column}
.dbr .l .ridlink{align-self:flex-start;margin-top:2px;font-size:10.5px}
.dbt{position:relative;height:26px}
.dbt .axl{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.dbt .tick{position:absolute;top:30%;bottom:30%;width:1px;background:var(--line)}
.dbt .cn{position:absolute;top:50%;height:2px;margin-top:-1px;background:var(--ink-3);opacity:.55;border-radius:2px}
.dbt .pt{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.dbt .pt.cur{background:var(--s1)}.dbt .pt.best{background:var(--s2)}
.dbr .gap{font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.dbr .gap b{font:600 13px var(--mono);color:var(--ink)}
.scale{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 180px;gap:14px}
.scale .ticks-l{position:relative;height:14px;font:11px var(--mono);color:var(--ink-3)}
.scale .ticks-l span{position:absolute;transform:translateX(-50%)}
.wl h4{margin:0 0 6px;font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.wl ul{margin:0 0 16px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.wl li{font-size:13px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.wl li span:last-child{font:500 12px var(--mono);color:var(--ink-2);white-space:nowrap}
.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
.tbl th{text-align:left;font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl tr.cur td{background:var(--surface-2)}
.tbl td.best{font-weight:700}
.tbl td.best::after{content:" \2191";color:var(--ink-3);font-weight:400}

/* Requirements */
.wline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.wline b{color:var(--ink);font-weight:600}
.wline .wl-f{display:inline-flex;align-items:center;gap:5px}
.wline .wl-f i{width:8px;height:8px;border-radius:2px;display:inline-block}
.wline .link{margin-left:auto}
.wpanel{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--surface-2)}
.wpanel .wgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.preset{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.wt{display:flex;flex-direction:column;gap:5px}
.wt .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wt .h b{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.wt .h b i{width:10px;height:10px;border-radius:3px;display:inline-block}
.wt .h span{font:500 12px var(--mono);color:var(--ink-2)}
.wt p{margin:0;font-size:11.5px;color:var(--ink-3)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--c) 0 var(--p),var(--line) var(--p) 100%)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--c)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--ink);margin-top:-6px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--surface);border:2px solid var(--ink)}
.rhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.rhead .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.movers{font-size:12px;color:var(--ink-2);margin:-4px 0 8px;min-height:18px}
.movers b{font-family:var(--mono);font-weight:600}
.rlist{display:flex;flex-direction:column;position:relative}
.rrow{display:grid;grid-template-columns:44px minmax(0,1fr) 120px 92px 56px 100px;gap:14px;align-items:center;padding:12px 10px;border-bottom:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);position:relative}
body.analyst .rrow{grid-template-columns:44px minmax(0,1fr) 120px 92px minmax(120px,190px) 56px 100px}
.rrow:hover{background:var(--surface-2)}
.rrow.sel{box-shadow:inset 3px 0 0 var(--accent);background:var(--surface-2)}
.rhdr{display:grid;grid-template-columns:44px minmax(0,1fr) 120px 92px 56px 100px;gap:14px;padding:0 10px 6px;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;border-bottom:1px solid var(--line-2)}
body.analyst .rhdr{grid-template-columns:44px minmax(0,1fr) 120px 92px minmax(120px,190px) 56px 100px}
.rhdr span:nth-child(n+3){text-align:right}
.rhdr span:last-child{text-align:left}
.rk{display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.rk b{font:600 20px/1 var(--disp)}
.delta{font:600 10.5px var(--mono);color:var(--ink-3)}
.delta.up::before{content:"\25B2 "}.delta.down::before{content:"\25BC "}
.delta.up{color:var(--good)}.delta.down{color:var(--crit)}
.rmain{min-width:0}
.rtop{display:flex;gap:8px;align-items:baseline;min-width:0}
.rtop .rid{flex:none}
.rtitle{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.wb{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.wb .bars{display:flex;flex-direction:column;gap:2px;width:100%}
.wb .bars i{display:block;height:5px;border-radius:2px}
.wb .bars i.w{background:var(--line-2)}
.wb .bars i.b{background:var(--s1)}
.wb small{font:500 11px var(--mono);color:var(--ink-3)}
.conf{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2)}
.conf .m{display:inline-flex;gap:2px}
.conf .m i{width:4px;height:10px;border-radius:1px;background:var(--line-2)}
.conf .m i.on{background:var(--ink-2)}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-2)}
.flag svg{width:13px;height:13px;fill:none;stroke:#c98500;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.kano{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.kano b{font-weight:600;color:var(--ink)}
.stack-tr{height:12px;background:var(--surface-2);border-radius:4px;position:relative}
.stack{display:flex;gap:2px;height:100%;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.stack span{height:100%;border-radius:2px;min-width:2px}
.stack span:last-child{border-radius:2px 4px 4px 2px}
.f-buy{background:var(--s1)}.f-net{background:var(--s2)}.f-gap{background:var(--s3)}.f-evidence{background:var(--s4)}.f-feas{background:var(--s5)}
.rscore{font:600 16px var(--disp);text-align:right;font-variant-numeric:tabular-nums}
.rnet{text-align:right}

/* Drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s;z-index:39}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--surface);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1);z-index:40;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.open{transform:none}
.dh{padding:16px 22px 12px;border-bottom:1px solid var(--line)}
.dh .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dh .row>div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dh h2{margin:10px 0 4px;font:600 22px/1.2 var(--disp)}
.dh p{margin:0;color:var(--ink-3);font-size:12.5px}
.navbtns{display:flex;gap:4px}
.x{border:0;background:transparent;width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.x:hover{background:var(--surface-2)}
.x svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.db-body{flex:1;overflow-y:auto;padding:4px 22px 24px}
.sum{padding:14px 0 6px}
.sum .motive{font-size:14px;margin:0 0 4px}
.sum blockquote{margin:6px 0 12px;font-size:13px;color:var(--ink-2);border-left:2px solid var(--line-2);padding-left:10px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.stat small{display:block;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat b{display:block;font:600 22px/1.15 var(--disp);margin-top:3px}
.stat span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.kanos{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.kanos>span:first-child{font-size:11.5px;color:var(--ink-3)}
.tgt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tgt div{border-radius:10px;padding:10px 12px;border:1px solid var(--line);font-size:13px}
.tgt small{display:block;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:4px}
.tgt .chg{display:block;margin-top:6px;font-size:11.5px;color:#c98500}
.risk{margin-top:10px;font-size:12.5px;display:grid;grid-template-columns:18px 1fr;gap:8px;color:var(--ink-2)}
.risk svg{width:16px;height:16px;fill:none;stroke:#c98500;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
details.ds{border-top:1px solid var(--line)}
details.ds>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:13px 0;font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
details.ds>summary::-webkit-details-marker{display:none}
details.ds>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details.ds[open]>summary::after{transform:rotate(-135deg)}
details.ds>summary em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--ink-3);font-weight:500;margin-left:auto;margin-right:12px}
details.ds>.in{padding:0 0 16px}
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.why div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);font-size:12.5px}
.why div small{display:block;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:4px}
table.bd{width:100%;border-collapse:collapse;font-size:12.5px}
.bd td{padding:6px 0;border-bottom:1px solid var(--line)}
.bd td:not(:first-child){text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.bd tr.tot td{border-bottom:0;font-weight:600;color:var(--ink)}
.bd i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:7px}
.mbars{display:flex;flex-direction:column;gap:6px}
.split{display:flex;height:14px;gap:2px;margin:4px 0 8px}
.split .ev{background:var(--s1);border-radius:4px 2px 2px 4px}
.split .as{border-radius:2px 4px 4px 2px;background:repeating-linear-gradient(45deg,var(--s7) 0 2px,transparent 2px 6px);border:1px solid var(--s7)}
.split-l{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.split-l i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.split-l i.ev{background:var(--s1)}
.split-l i.as{background:repeating-linear-gradient(45deg,var(--s7) 0 2px,transparent 2px 5px);border:1px solid var(--s7)}
.quotes{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.quotes blockquote{margin:0;border-left:2px solid var(--line-2);padding:2px 0 2px 12px;font-size:13px}
.quotes blockquote footer{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.assume{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.assume li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:12.5px;border:1px dashed var(--s7);border-radius:9px;padding:8px 10px}
.assume li b{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--s7);font-weight:700;margin-top:1px}
.unc{display:flex;flex-direction:column;gap:8px}
.unc-tr{position:relative;height:30px}
.unc-tr .axl{position:absolute;left:0;right:0;top:15px;height:1px;background:var(--line-2)}
.unc-tr .rng{position:absolute;top:10px;height:10px;border-radius:5px;background:color-mix(in oklab,var(--s1) 25%,transparent);border:1px solid var(--s1)}
.unc-tr .pt{position:absolute;top:9px;width:12px;height:12px;border-radius:50%;margin-left:-6px;background:var(--s1);box-shadow:0 0 0 2px var(--surface)}
.unc-tr .nb{position:absolute;top:8px;width:2px;height:14px;background:var(--ink-3);margin-left:-1px;opacity:.6}
.unc p{margin:0;font-size:12.5px;color:var(--ink-2)}
.warnbox{border:1px solid color-mix(in oklab,#c98500 45%,var(--line));background:color-mix(in oklab,#fab219 9%,var(--surface));border-radius:10px;padding:10px 12px;font-size:12.5px;display:grid;grid-template-columns:18px 1fr;gap:8px}
.warnbox svg{width:17px;height:17px;fill:none;stroke:#c98500;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chal{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2);font-size:13px;min-height:44px;margin-top:10px}
.chal ul{margin:6px 0;padding-left:18px}
.chal p{margin:4px 0}
.decide{border-top:1px solid var(--line);padding:12px 22px 14px;background:var(--surface);max-height:62vh;overflow-y:auto}
.decide .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px}
.opt svg{width:16px;height:16px;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.opt.approve svg{stroke:var(--good)}.opt.modify svg{stroke:#c98500}.opt.reject svg{stroke:var(--crit)}.opt.challenge svg{stroke:var(--s7)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt kbd{font:500 10px var(--mono);color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.dform{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.dform label{font-size:11.5px;color:var(--ink-3);font-weight:600;display:flex;flex-direction:column;gap:5px}
.dform textarea,.dform input{border:1px solid var(--line-2);background:var(--surface-2);border-radius:9px;padding:8px 10px;font-size:13px;resize:vertical;font-weight:400;color:var(--ink)}
.dform .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dform .row>div{display:flex;gap:8px}
.prev{font-size:12px;color:var(--ink-3);margin-top:10px}
.keys{font-size:11px;color:var(--ink-3);margin-top:8px}
.keys kbd{font:500 10.5px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px}

/* Simulator */
.sim{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.cfg{position:sticky;top:96px}
.fopt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.fopt:last-child{border-bottom:0}
.fopt .nm{min-width:0}
.fopt .nm b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fopt .nm small{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-3)}
.fopt .eff{font:600 12px var(--mono);text-align:right;white-space:nowrap}
.fopt.na{opacity:.45}
.sw2{position:relative;width:36px;height:20px;border-radius:999px;border:0;background:var(--line-2);padding:0;flex:none;transition:background .2s}
.sw2::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.sw2[aria-checked="true"]{background:var(--accent)}
.sw2[aria-checked="true"]::after{transform:translateX(16px)}
.sw2:disabled{opacity:.5;cursor:not-allowed}
.cfg .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;margin:14px 0 6px}
.cfg .grp:first-of-type{margin-top:0}
.cx{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.cx .m{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.cx .m i{display:block;height:100%;border-radius:4px;background:var(--ink-2);transition:width .4s}
.cx .m i.hi{background:var(--crit)}
.story{font-size:13px;color:var(--ink-2);margin:0;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.story b{color:var(--ink)}

.qwrap{overflow-x:auto}
@media (max-width:640px){.qwrap svg{min-width:580px}}
/* Feature map */
.fmap{position:relative}
.fmap svg circle.pt{transition:r .2s,opacity .2s}
.fm-side .nn{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.fm-side .nnr{display:grid;grid-template-columns:minmax(0,1fr) 90px 40px;gap:10px;align-items:center;font-size:12.5px}
.fm-side .nnr .tr{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.fm-side .nnr .tr i{display:block;height:100%;background:var(--s1);border-radius:4px}
.fm-side .nnr span:last-child{font:500 11.5px var(--mono);text-align:right}
.fm-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fm-item{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.fm-item[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fm-item.new{border-style:dashed}
.pred{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.pred b{font:600 30px/1 var(--disp)}

/* Copilot */
.cp{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.chat{display:flex;flex-direction:column;padding:0;height:calc(100vh - 160px);min-height:520px}
.msgs{flex:1;overflow-y:auto;padding:22px 22px 8px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:10px;max-width:760px}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .av{width:34px;height:34px;flex:none;border-radius:10px;background:#efeee9;padding:2px}
.msg.user .av{display:grid;place-items:center;background:var(--ink);color:var(--surface);font:600 12px var(--font);padding:0}
.bub{border-radius:14px;padding:10px 14px;font-size:13.5px;line-height:1.55;min-width:0}
.msg.user .bub{background:var(--ink);color:var(--surface);border-bottom-right-radius:4px}
.msg.ai .bub{background:var(--surface-2);border:1px solid var(--line);border-top-left-radius:4px}
.bub p{margin:0 0 6px}.bub p:last-child{margin-bottom:0}
.bub ul{margin:4px 0 6px;padding-left:18px}.bub li{margin:2px 0}
.bub .meta{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:11px;color:var(--ink-3)}
.typing{display:inline-flex;gap:4px;align-items:center;color:var(--ink-3);font-size:12.5px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:dot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.composer{display:flex;gap:8px;align-items:flex-end;padding:12px 14px;border-top:1px solid var(--line)}
.composer .vbtn{width:42px;height:42px;padding:0;display:grid;place-items:center;flex:none}
.composer .vbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.composer .vbtn.rec{background:#e5533d;color:#fff;border-color:#e5533d;animation:micpulse 1.2s ease-in-out infinite}
.composer .vbtn.busy{opacity:.6}
.composer .vbtn.on{background:var(--accent,#2b59ff);color:#fff;border-color:transparent}
@keyframes micpulse{50%{box-shadow:0 0 0 6px rgba(229,83,61,.25)}}
.composer textarea{flex:1;border:1px solid var(--line-2);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13.5px;resize:none;max-height:140px;min-height:42px;line-height:1.4}
.cstat{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3);padding:0 16px 12px}
.cstat i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.cstat.live i{background:var(--good)}
.hello{margin:auto;max-width:520px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 0}
.hello .big{width:96px;height:96px;background:#efeee9;border-radius:24px;padding:6px}
.hello h3{margin:4px 0 0;font:600 20px var(--disp)}
.hello p{margin:0;color:var(--ink-2);font-size:13.5px}
.sugs{display:flex;flex-direction:column;gap:6px}
.sug{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;text-align:left;font-size:13px;color:var(--ink)}
.sug:hover{border-color:var(--accent);color:var(--accent)}
.hello .sugs{width:100%;margin-top:8px}
.ctx dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.ctx dt{color:var(--ink-3)}
.ctx dd{margin:0;color:var(--ink);text-align:right}

/* Log */
.tile4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.lt{display:flex;align-items:center;gap:14px}
.lt .st svg{width:22px;height:22px}
.lt .num{font:600 30px/1 var(--disp)}
.lt .lbl{font-size:12px;color:var(--ink-3)}
pre.spec{white-space:pre-wrap;word-break:break-word;font:12px/1.55 var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:560px;overflow:auto;margin:0;color:var(--ink-2)}
.signas{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.signas input{border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:4px 8px;font-size:12.5px;width:150px}

/* Concept 3D */
.stage{position:relative;height:580px;border-radius:12px;overflow:hidden;background:radial-gradient(120% 90% at 50% 22%,var(--stage-a) 0%,var(--stage-b) 75%);touch-action:none;cursor:grab;border:1px solid var(--line);outline:none}
.stage.drag{cursor:grabbing}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pins,.dims{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;width:0;height:0;border:0;padding:0;background:transparent;pointer-events:auto;--d:26px;transition:opacity .25s}
.pin .o{position:absolute;left:calc(var(--d) / -2);top:calc(var(--d) / -2);width:var(--d);height:var(--d);border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);font:600 11px var(--mono);box-shadow:0 0 0 2.5px var(--pc),0 3px 10px rgba(0,0,0,.25);transition:transform .15s}
.pin:hover .o,.pin.focus .o,.pin.hl .o{transform:scale(1.18)}
.pin .lab{position:absolute;left:calc(var(--d) / 2 + 8px);top:0;transform:translate(-4px,-50%);background:var(--ink);color:var(--surface);font-size:11.5px;font-weight:500;padding:4px 9px;border-radius:7px;white-space:nowrap;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;box-shadow:var(--shadow)}
.pin:hover .lab,.pin:focus-visible .lab,.pin.hl .lab{opacity:1;transform:translate(0,-50%)}
.pin.back{opacity:.25}
.pin.approved{--pc:var(--good)}.pin.modified{--pc:#c98500}.pin.rejected{--pc:var(--crit)}.pin.open{--pc:var(--accent)}
.pin.focus .o{animation:pulse 1.6s infinite}
.dims .dl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font:500 11px var(--mono);color:var(--ink-2);background:color-mix(in oklab,var(--surface) 85%,transparent);padding:2px 6px;border-radius:6px;white-space:nowrap}
.dims .dl{margin-left:0}
.st-top{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;pointer-events:none}
.st-top>*,.st-bl>*,.st-br>*{pointer-events:auto}
.seg.glass{background:color-mix(in oklab,var(--surface) 80%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.st-tg{display:flex;gap:6px}
.tg{border:1px solid var(--line);background:color-mix(in oklab,var(--surface) 80%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.st-bl{position:absolute;left:12px;bottom:12px}
.st-br{position:absolute;right:12px;bottom:12px}
.swatches{display:flex;gap:6px;padding:6px;border-radius:999px;background:color-mix(in oklab,var(--surface) 80%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line)}
.sw{width:22px;height:22px;border-radius:50%;border:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.focus-card{position:absolute;left:12px;bottom:60px;width:min(340px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);animation:rise .25s cubic-bezier(.2,.8,.2,1)}
.fc-h{display:flex;gap:8px;align-items:center}
.fc-h .x{margin-left:auto;width:26px;height:26px}
.focus-card b{display:block;margin-top:6px;font-size:14px}
.focus-card p{margin:3px 0 10px;font-size:12.5px;color:var(--ink-2)}
.fc-a{display:flex;gap:6px}
.fc-a .primary{margin-left:auto}
.show-head{display:none}
.visu-frame{position:fixed;border:0;display:block;visibility:hidden;pointer-events:none;background:#0d0f13}
.stage.visu{background:#0d0f13;cursor:auto;touch-action:auto}
.g:has(.stage.visu){animation:none;transform:none}
.stage.visu .focus-card{z-index:6;max-height:calc(100% - 120px);overflow-y:auto}
.stage.visu.showroom .show-head{z-index:97}
.fc-why{font-size:12px}
.na{color:var(--ink-3);font-weight:600}
.fc-part{display:flex;flex-direction:column;gap:3px;margin:0 0 10px;padding:8px 10px;border-radius:10px;background:var(--surface-2,rgba(127,127,127,.08));font-size:12.5px}
.fc-part b{display:inline;margin:0;font-size:13px}
.fc-part .heat{font:600 12px var(--disp);margin-left:4px}
.fc-part small{font-size:11.5px;color:var(--ink-2)}
.fc-opt{display:flex;flex-direction:column;gap:2px;margin:0 0 10px;font-size:12px}
.fc-opt small{font-size:11.5px;color:var(--ink-2)}
.fc-opt b{display:inline;margin:0;font-size:11.5px}
.fc-part q{font-size:12px;font-style:italic;color:var(--ink-2)}
.stage.showroom{position:fixed;inset:0;z-index:95;height:auto;border-radius:0;border:0}
.stage.showroom .pins,.stage.showroom .st-top,.stage.showroom .focus-card,.stage.showroom .dims,.stage.showroom .st-bl{display:none}
.stage.showroom .show-head{display:flex;position:absolute;left:28px;right:28px;top:24px;justify-content:space-between;align-items:flex-start;gap:16px}
.show-head b{display:block;font:600 32px/1.1 var(--disp)}
.show-head span{color:var(--ink-2);font-size:13px}
.stage-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink-3);font-size:13px;padding:20px}
.stage-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;align-items:center}
.oncar{display:flex;flex-direction:column;max-height:600px;overflow-y:auto;margin:0 -6px}
.oc{display:grid;grid-template-columns:24px minmax(0,1fr) 20px;gap:10px;align-items:center;padding:9px 6px;border-radius:9px;cursor:pointer;border-bottom:1px solid var(--line)}
.oc:hover,.oc.sel{background:var(--surface-2)}
.oc.sel{box-shadow:inset 3px 0 0 var(--accent)}
.oc .n{font:600 14px var(--disp);color:var(--ink-3)}
.oc b{display:block;font-size:13px;font-weight:600}
.oc small{display:block;font-size:12px;color:var(--ink-2);line-height:1.35;margin-top:2px}
.oc.rejected small{text-decoration:line-through;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.tile .sk{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:flex;gap:8px;align-items:center}
.tile .sv{font-size:13px;flex:1}
.tile.rejected .sv{text-decoration:line-through;color:var(--ink-3)}

/* Palette */
.pal-wrap{position:fixed;inset:0;z-index:100;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.pal{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;animation:rise .2s}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 18px;font-size:15px;outline:0}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow-y:auto}
.pal li{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;font-size:13.5px;cursor:pointer}
.pal li small{margin-left:auto;color:var(--ink-3);font-size:11.5px}
.pal li[aria-selected="true"]{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--accent)}
.pal .ph{font-size:11px;color:var(--ink-3);padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}

/* Tooltip, toast, coach, fab */
.tip{position:fixed;z-index:110;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;line-height:1.45;padding:8px 10px;border-radius:9px;max-width:300px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;box-shadow:var(--shadow)}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:600}
.tip .tr{display:flex;justify-content:space-between;gap:14px}
.tip .tr i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--surface);padding:9px 10px 9px 16px;border-radius:12px;font-size:13px;z-index:105;transition:all .3s cubic-bezier(.2,.8,.2,1);display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:transparent;color:inherit;font-weight:600;text-decoration:underline;padding:4px 6px}
.fab{position:fixed;right:24px;bottom:24px;z-index:30;display:flex;align-items:center;gap:9px;border:0;background:var(--ink);color:var(--surface);padding:7px 16px 7px 7px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:var(--shadow);transition:transform .2s}
.fab:hover{transform:translateY(-2px)}
.fab .nordi-mini{width:30px;height:30px;border-radius:50%}
.coach{position:fixed;right:24px;bottom:24px;z-index:60;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.coach .nb{width:76px;height:76px;background:#efeee9;border-radius:18px;padding:4px}
.coach small{font:500 11px var(--mono);color:var(--ink-3)}
.coach h4{margin:2px 0 4px;font:600 17px/1.2 var(--disp)}
.coach p{margin:0;font-size:13px;color:var(--ink-2)}
.coach .acts{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px}
.coach .dots{display:flex;gap:5px}
.coach .dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.coach .dots i.on{background:var(--ink);width:16px;border-radius:3px}
.spot{position:relative;z-index:2;box-shadow:0 0 0 2px var(--accent),0 0 0 8px color-mix(in oklab,var(--accent) 18%,transparent)!important;transition:box-shadow .3s}

/* Nordi animation */
.mascot-body{animation:bob 3s ease-in-out infinite;transform-origin:60px 100px}
.mascot-eyes{animation:blink 5s infinite;transform-origin:60px 60px}
.mascot-arm{animation:wave 1.2s ease-in-out infinite;transform-origin:96px 70px}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes wave{50%{transform:rotate(-18deg)}}
@media (prefers-reduced-motion:reduce){
  .mascot-body,.mascot-eyes,.mascot-arm,.view.enter>*,.typing i,.step.now .ic::after,.pin.focus .o{animation:none}
  *{transition:none!important}
}

/* Responsive */
@media (max-width:1180px){
  .c3{grid-column:span 6}.c4,.c5,.c7,.c8{grid-column:span 12}
  .cp{grid-template-columns:1fr}
  .ctx{order:2}
  .sim{grid-template-columns:1fr}
  .cfg{position:static}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wpanel .wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  body.analyst .rrow,body.analyst .rhdr{grid-template-columns:44px minmax(0,1fr) 120px 92px 56px 100px}
  body.analyst .rrow .stack-tr,body.analyst .rhdr .shc{display:none}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;min-width:0}
  .brand small{display:none}
  .brand b{font-size:17px}
  .nav{flex-direction:row;overflow-x:auto;flex:1;scrollbar-width:none;min-width:0}
  .nav::-webkit-scrollbar{display:none}
  .nav .grp{display:none}
  .nav button{padding:7px 10px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 #6f8ff5}
  .nav .count{display:none}
  .side-foot{display:none}
  .top{position:static;padding:14px 16px}
  .view{padding:16px 16px 96px}
  .c6{grid-column:span 12}
  .tile4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chat{height:auto;min-height:0}
  .msgs{min-height:360px}
  .reco{grid-template-columns:1fr}
}
@media (max-width:640px){
  .c3{grid-column:span 12}
  .ctrls{width:100%}
  .ctrl{width:100%;justify-content:space-between}
  .ctrl>span{display:none}
  .ctrl .seg{width:100%}
  .ctrl .seg button{flex:1;justify-content:center;padding:6px 4px}
  .searchbtn{flex:1}
  .frow{grid-template-columns:minmax(0,1fr) 64px;gap:4px 10px}
  .frow .fl{grid-column:1/-1}
  .hb,.dv{grid-template-columns:minmax(0,104px) minmax(0,1fr) 60px;gap:8px}
  .trow{grid-template-columns:20px minmax(0,1fr) 64px 20px}
  .trow .rid,.trow .v{display:none}
  .rrow,body.analyst .rrow{grid-template-columns:36px minmax(0,1fr) 70px;gap:6px 10px}
  .rhdr{display:none!important}
  .rrow .wb{display:none}
  .rrow .rnet{grid-column:2;grid-row:2;text-align:left}
  .rrow .rscore{grid-column:3;grid-row:1}
  .rrow .rstatus{grid-column:3;grid-row:2;justify-self:end}
  .rrow .rk{grid-row:1/3}
  .dbr,.scale{grid-template-columns:minmax(0,92px) minmax(0,1fr) 62px;gap:8px}
  .dbr .gap span{display:none}
  .why,.stats3{grid-template-columns:1fr}
  .tgt{grid-template-columns:1fr}
  .feed{grid-template-columns:1fr}
  .fab .fl{display:none}
  .fab{padding:7px;right:16px;bottom:16px}
  .coach{right:16px;bottom:16px;grid-template-columns:56px minmax(0,1fr)}
  .coach .nb{width:56px;height:56px}
  .kpi .num{font-size:28px}
  .tile4{gap:10px}
  .tiles{grid-template-columns:1fr}
  .stage{height:460px}
  .st-br{bottom:auto;top:56px;right:12px}
  .focus-card{bottom:58px}
  .wpanel .wgrid{grid-template-columns:1fr}
  .nextstep{flex-wrap:wrap}
  .nextstep .btn{width:100%}
}

/* ---------- Nordi side panel: one click away on every view ---------- */
:root{--cpw:400px}
.main{container-type:inline-size;container-name:main;transition:margin-right .38s cubic-bezier(.2,.8,.2,1)}
.cpanel{position:fixed;top:0;right:0;bottom:0;width:var(--cpw);max-width:100vw;z-index:38;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow);transform:translateX(102%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s linear .38s}
.cpanel.open{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s}
.cph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line)}
.cph-id{display:flex;align-items:center;gap:10px;min-width:0}
.cph-id .av{width:36px;height:36px;border-radius:11px;background:#efeee9;padding:2px;flex:none}
.cph-id b{font:600 16px/1.1 var(--disp)}
.cph .cstat{padding:0;margin-top:3px;font-size:11px}
.cph-acts{display:flex;gap:2px}
.x svg{stroke-linejoin:round}
.cpctx{margin:10px 14px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:12px}
.cpctx summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;color:var(--ink-2)}
.cpctx summary::-webkit-details-marker{display:none}
.cpctx summary span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpctx summary svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;transition:transform .2s}
.cpctx[open] summary svg{transform:rotate(180deg)}
.cpctx dl{margin:0;padding:4px 10px;display:grid;grid-template-columns:auto 1fr;gap:5px 12px}
.cpctx dt{color:var(--ink-3)}
.cpctx dd{margin:0;text-align:right}
.cpctx p{margin:0;padding:4px 10px 9px;color:var(--ink-3);font-size:11.5px}
.cpanel .msgs{padding:16px 14px 8px;gap:14px;min-height:0}
.cpanel .msg .av{width:30px;height:30px;border-radius:9px}
.cpanel .bub{font-size:13px}
.cpanel .hello{padding:12px 4px}
.cpanel .hello .big{width:76px;height:76px;border-radius:20px}
.cpanel .hello h3{font-size:18px}
.cpanel .hello p{font-size:13px}
.cpsugs{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none}
.cpsugs::-webkit-scrollbar{display:none}
.cpsugs:empty{display:none}
.cpsugs .fchip{white-space:nowrap;font-size:12px}
.cpanel .composer{padding:10px 12px 12px}
.cpanel .composer .btn{padding:0 12px;height:42px}
.coach.beside{right:calc(var(--cpw) + 20px)}
@media (min-width:1280px){body.cp-open .main{margin-right:var(--cpw)}}
@container main (max-width:1000px){
  .c3{grid-column:span 6}.c4,.c5,.c7,.c8{grid-column:span 12}
  .cp,.sim{grid-template-columns:1fr}
  .cfg{position:static}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wpanel .wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  body.analyst .rrow,body.analyst .rhdr{grid-template-columns:44px minmax(0,1fr) 120px 92px 56px 100px}
  body.analyst .rrow .stack-tr,body.analyst .rhdr .shc{display:none}
}
@media (max-width:900px){
  .cpanel{width:100vw}
  body.cp-open{overflow:hidden}
  .coach.beside{right:16px;bottom:auto;top:76px}
}

/* BMW data layer */
.chip.real{cursor:pointer;font:inherit;font-size:11.5px;border-style:solid}
.chip.real .dot{background:var(--good)}
.chip.real:hover{border-color:var(--ink-3)}
.chip.new{border-style:dashed;color:var(--s7)}
.chip.ft i{width:8px;height:8px;border-radius:2px;display:inline-block}
.evl{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.evl.high{color:var(--good);border-color:color-mix(in oklab,var(--good) 40%,var(--line))}
.evl.medium{color:#c98500;border-color:color-mix(in oklab,#c98500 40%,var(--line))}
.evl.low{color:var(--crit);border-color:color-mix(in oklab,var(--crit) 40%,var(--line))}
.hc.na{background:transparent;border:1px dashed var(--line-2);color:var(--ink-3);font-size:11px}
.hc.mod{outline:1.5px dashed var(--ink-3);outline-offset:-3px}
.kano.mod{border-style:dashed}
.ft-L{background:var(--s3)}.ft-W{background:var(--s1)}.ft-D{background:var(--s4)}.ft-F{background:var(--crit)}
.legend i.ft-L,.legend i.ft-W,.legend i.ft-D,.legend i.ft-F{border-radius:3px}
.tbar{display:flex;gap:2px;height:10px;width:100%;min-width:2px}
.tbar span{height:100%;border-radius:2px;min-width:2px}
.tbar.wide{height:16px;margin:6px 0 8px}
.fsub{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;margin:16px 0 6px}
.fsub:first-child{margin-top:0}
.stu{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;background:var(--surface-2);font-size:12.5px}
.stu>b{margin-right:8px}
.stu>span{font-size:11.5px}
.stur{display:flex;justify-content:space-between;gap:10px;margin-top:4px;color:var(--ink-2)}
.stur .mono{font-size:11.5px;white-space:nowrap;color:var(--ink)}
.opt-line{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;background:var(--surface-2)}
.opt-line .mono{white-space:nowrap;font-size:12px}
.assume li.unc-li{border-color:var(--line-2);border-style:solid}
.assume li.unc-li b{color:var(--ink-3)}
.who{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)}
.who.human{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 40%,var(--line))}
.who.ai{color:var(--s7);border-color:color-mix(in oklab,var(--s7) 40%,var(--line))}
.who.system{color:var(--ink-2)}
.who.big{font-size:11px;padding:4px 8px}
.hist{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:grid;grid-template-columns:64px 1fr;gap:10px;font-size:12.5px;border-bottom:1px solid var(--line);padding-bottom:8px}
.hist p{margin:2px 0;color:var(--ink-2)}
.hist small{color:var(--ink-3);font-size:11px}
.prof{display:flex;flex-direction:column;gap:6px}
.pr{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) 52px;gap:12px;align-items:center;font-size:12.5px}
.pr .l{display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink-2)}
.pr .pt{display:block}
.pr .pt>span{display:block}
.pr .v{font:500 12px var(--mono);text-align:right}
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.fl-step{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;position:relative}
.fl-step:not(:last-child)::after{content:"";position:absolute;right:-8px;top:22px;width:6px;height:6px;border-top:2px solid var(--line-2);border-right:2px solid var(--line-2);transform:rotate(45deg)}
.fl-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fl-h .n{font:600 13px var(--disp);color:var(--ink-3)}
.fl-h b{font-size:13.5px}
.fl-step p{margin:0;font-size:12.5px;color:var(--ink-2)}
.fl-step small{font-size:11px;color:var(--ink-3);margin-top:auto}
.tbl.au td{font-size:12px}
@container main (max-width:1000px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.fl-step::after{display:none}.decide .opts{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.flow{grid-template-columns:1fr}.pr{grid-template-columns:minmax(0,140px) minmax(0,1fr) 40px}.decide .opts{grid-template-columns:repeat(2,1fr)}}

/* ---------- Essentials vs Analyst, review flow, review log ---------- */
body.analyst .ess{display:none!important}
.nav .more{margin-top:8px;border:1px dashed var(--side-line)!important;color:var(--side-ink-2)}
.nav .more:hover{color:var(--side-ink)}
.rchip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.rchip.lock{color:var(--good);border-color:color-mix(in oklab,var(--good) 45%,var(--line))}
.rchip.think{color:#a86d00;border-color:color-mix(in oklab,#c98500 45%,var(--line))}
.rchip.drop{color:var(--crit);border-color:color-mix(in oklab,var(--crit) 45%,var(--line))}
.rchip.check{color:var(--s7);border-color:color-mix(in oklab,var(--s7) 45%,var(--line))}
.rwhy{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.rmeta{flex-wrap:nowrap}
body.analyst .rmeta{flex-wrap:wrap}
body:not(.analyst) .rrow,body:not(.analyst) .rhdr{grid-template-columns:44px minmax(0,1fr) 92px 150px}
.rhdr span:last-child{text-align:left}
.recheck{display:inline-flex;margin-left:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#a86d00;border:1px dashed color-mix(in oklab,#c98500 50%,var(--line));border-radius:6px;padding:0 5px}
.st.challenged svg{stroke:var(--s7)}
/* next decisions on the essentials overview */
.ndl{display:flex;flex-direction:column}
.nd{display:grid;grid-template-columns:24px minmax(0,1fr) auto 20px 58px;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);border-radius:9px;cursor:pointer}
.nd:last-child{border-bottom:0}
.nd:hover{background:var(--surface-2)}
.nd .n{font:600 16px var(--disp);color:var(--ink-3);text-align:center}
.nd-b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nd .netv{text-align:right}
.recent{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.recent li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;font-size:13px}
.recent li small{grid-column:2;color:var(--ink-3);font-size:11.5px}
/* drawer */
.rvbar{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink-2);margin:-4px 0 10px;padding:8px 10px;border-radius:10px;background:var(--accent-soft)}
.rvbar b{color:var(--ink)}
.rvtrack{flex:1;height:4px;border-radius:4px;background:color-mix(in oklab,var(--accent) 18%,transparent);overflow:hidden}
.rvtrack i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.reco-line{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);margin-bottom:10px}
.reco-line .rchip{margin-top:1px}
.decide .cur{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--ink-3);margin-bottom:10px}
.decide .cur q{flex-basis:100%;color:var(--ink-2);font-size:12.5px}
.decide .opts.five{grid-template-columns:repeat(5,1fr)}
.opt.keep svg{stroke:var(--accent)}
.dform select{border:1px solid var(--line-2);background:var(--surface-2);border-radius:9px;padding:8px 10px;font-size:13px;color:var(--ink);font-weight:400}
.hint{font-size:12px;color:var(--ink-3)}
.hint.warn{color:#a86d00}
.diff{display:flex;flex-direction:column;gap:3px;font-size:12.5px;margin:4px 0}
.diff del{color:var(--ink-3);text-decoration:line-through;text-decoration-color:color-mix(in oklab,var(--crit) 60%,transparent)}
.diff ins{text-decoration:none;color:var(--ink);background:color-mix(in oklab,var(--good) 10%,transparent);border-radius:4px;padding:1px 4px;align-self:flex-start}
/* review log */
.card.round{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.rd-h{display:flex;gap:12px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rd-h b{font:600 18px var(--disp);margin-right:10px}
.rd-h span{font-size:12.5px;color:var(--ink-2)}
.rd-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dbar{display:flex;gap:2px;height:10px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.dbar i,.dleg i{display:block;background:var(--line-2)}
.dbar .approved,.dleg .approved{background:var(--good)}.dbar .modified,.dleg .modified{background:#c98500}.dbar .rejected,.dleg .rejected{background:var(--crit)}.dbar .challenged,.dleg .challenged{background:var(--s7)}
.dleg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink-2)}
.dleg span{display:inline-flex;align-items:center;gap:6px}
.dleg span.zero{color:var(--ink-3)}
.dleg i{width:8px;height:8px;border-radius:2px}
.dleg .rc{color:#a86d00;font-weight:600}
.rd-f{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.rd-f .note{flex:1;min-width:240px;margin:0}
.lelist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.le{border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:12px;padding:12px 14px;background:var(--surface)}
.le.approved{border-left-color:var(--good)}.le.modified{border-left-color:#c98500}.le.rejected{border-left-color:var(--crit)}.le.challenged{border-left-color:var(--s7)}.le.open{border-left-color:var(--ink-3)}
.le-h{display:flex;justify-content:space-between;align-items:flex-start;gap:6px 12px;flex-wrap:wrap}
.le-tr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.le-tr .arr{color:var(--ink-3)}
.le-n{font:500 11px var(--mono);color:var(--ink-3)}
.le-t{display:flex;gap:8px;align-items:baseline;border:0;background:transparent;padding:0;margin:0;font-weight:600;font-size:14px;text-align:left;color:var(--ink);min-width:0;flex:1 1 240px}
.le-t:hover{color:var(--accent)}
.le q{display:block;font-size:13px;color:var(--ink-2);margin-top:6px}
.le-ask{margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}
.le-m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:11.5px;color:var(--ink-3);margin-top:8px}
.le-m .adv:empty{display:none}
.le-end{margin-left:auto;display:inline-flex;gap:10px;align-items:center}
.le-end .link{font-size:12px}
.le-round{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;padding:4px 2px}
.le-round::before,.le-round::after{content:"";flex:1;border-top:1px dashed var(--line-2)}
.le-rev{display:flex;gap:6px;margin-top:8px}
.le-rev input{flex:1;border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:5px 9px;font-size:12.5px}
.stackcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.openl,.specl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.openl li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13px}
.openl li small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.specl{counter-reset:s}
.specl li{display:flex;gap:8px;align-items:center;font-size:13px}
.row-btns{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.au td del{color:var(--ink-3)}
@media (max-width:640px){
  .nd-b{white-space:normal}
  .le-t{flex-basis:100%}
  .stats3{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .stat{padding:8px 9px}
  .stat small{font-size:9.5px;letter-spacing:.03em}
  .stat b{font-size:18px}
  .stat span{font-size:10.5px}
  .decide .keys{display:none}
  body:not(.analyst) .rrow{grid-template-columns:36px minmax(0,1fr) 70px}
  .rwhy{display:none}
  .nd{grid-template-columns:20px minmax(0,1fr) auto 18px 46px;gap:8px}
  .decide .opts.five{grid-template-columns:repeat(3,1fr)}
  .rvbar .rvtrack{display:none}
}

/* Top 10 purchase drivers per model and market */
details.rest{margin-top:14px;border-top:1px solid var(--line)}
details.rest>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 10px;font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
details.rest>summary::-webkit-details-marker{display:none}
details.rest>summary em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--ink-3);font-weight:500}
.cfg details.rest>summary{padding:10px 0}
.rrow.out{opacity:.62}
.rrow.out:hover{opacity:1}
.hc.out{opacity:.4}
.hc sup{font:600 9px var(--mono);margin-right:3px;opacity:.75;vertical-align:4px}
.kano.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip.top{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.fm-item.top{font-weight:600;color:var(--ink);border-color:var(--line-2)}
.stu.cur b{color:var(--accent)}
.robust{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--mono);padding:1px 6px;border-radius:var(--r-s);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.robust::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.robust.all::before{background:var(--good)}.robust.some::before{background:var(--amber)}
.cut{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 0;font-size:12px;color:var(--ink-2)}
.mkranks{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0 12px;font-size:11.5px;color:var(--ink-3)}
.mkr{border:1px solid var(--line);background:transparent;border-radius:var(--r-s);padding:1px 7px;font:500 11.5px var(--mono);color:var(--ink-3)}
.mkr.in{color:var(--ink);border-color:var(--line-2)}
.mkr.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rbl{border:1px solid var(--line);background:transparent;border-radius:var(--r-s);padding:1px 8px;font-family:inherit;font-size:11.5px;font-weight:500;color:var(--accent);cursor:pointer}
.rbl:hover{border-color:var(--accent)}
.rbnote{border-top:1px solid var(--line);padding:10px 0}
.rbnote:first-of-type{border-top:0;padding-top:0}
.rbh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rbh small{color:var(--ink-3)}
.rbnote ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}

/* Compact layout: more of the decision on one screen (Rowboat frame is about 1240 x 700); desktop only, phones keep their own layout */
@media (min-width:901px){
.app{grid-template-columns:208px minmax(0,1fr)}
.side{padding:14px 10px 12px;gap:12px}
.brand{padding:2px 6px}
.nav button{padding:7px 10px;font-size:13px}
.nav .grp{padding:10px 10px 3px}
.side-foot{gap:8px}
.side-foot .chip{white-space:normal;justify-content:flex-start;text-align:left;background:transparent;border-color:var(--side-line);color:var(--side-ink-2);font-size:11px;line-height:1.35;padding:5px 8px;border-radius:9px;cursor:pointer}
.side-foot .chip:hover{color:var(--side-ink)}
.mini-pipe{padding:8px 10px}
.top{padding:9px 22px;gap:8px 14px;flex-wrap:nowrap}
.crumb{min-width:0}
.crumb h1{font-size:19px}
.crumb p{font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls{gap:6px;flex-wrap:nowrap;flex:none}
.ctrl{gap:0}
.seg{padding:2px}
.seg button{padding:4px 9px;font-size:12px}
.searchbtn{padding:6px 8px}
.view{padding:16px 22px 72px}
.view>*+*{margin-top:12px}
.g{gap:12px}
.card{padding:14px 16px}
.card-h{margin-bottom:10px}
.kpi{gap:3px}
.kpi .num{font-size:26px}
.kpi .num small{font-size:15px}
.nextstep{padding:9px 14px;gap:12px}
.nextstep .nb{width:34px;height:34px;padding:2px}
.nextstep b{font-size:13.5px}
.nd{padding:7px 6px}
.nd-b{font-size:13px}
.nd .n{font-size:14px}
.nd .st span{font-size:11.5px}
.rrow{padding:7px 10px;gap:12px}
.rk b{font-size:16px}
.rmain{display:flex;align-items:center;gap:10px;min-width:0}
