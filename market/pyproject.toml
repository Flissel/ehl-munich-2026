[project]
name = "ehl-market"
version = "0.1.0"
description = "MCP server: credible external market sources + correlation with BMW customer signals"
requires-python = ">=3.12"
dependencies = ["mcp>=1.2", "pandas>=2.2", "scipy>=1.13", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ehl-market = "ehl_market.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
ehl_market = ["*.html"]
